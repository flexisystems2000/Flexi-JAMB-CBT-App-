<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile Settings - Flexi Educational Consult</title>
<script>
(function () {
    try {
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    } catch (e) {}
})();
</script>

<link rel="stylesheet" href="theme.css">
  <script src="lucide.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding-bottom: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--header);
      padding: 10px 0;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      text-decoration: none;
      cursor: default;
    }

    .card {
      background-color: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .avatar-container-rel {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 8px;
    }

    .avatar-large {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #9CA3AF;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px solid #D1D5DB;
    }

    body.dark .avatar-large {
      background-color: #4B5563;
      border-color: #6B7280;
    }

    .avatar-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-large i {
      width: 56px;
      height: 56px;
      stroke-width: 1.5;
    }

    .camera-btn {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--green, #2E8B57);
      color: #ffffff;
      border: 2px solid var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .camera-btn:hover { transform: scale(1.08); }
    .camera-btn:active { transform: scale(0.95); }

    .avatar-email {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--green, #2E8B57);
    }

    .form-textarea {
      resize: vertical;
      min-height: 85px;
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      border-radius: 25px;
      border: none;
      background-color: var(--green, #2E8B57);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-save:active { opacity: 0.85; }

    .btn-logout {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 25px;
      border: 1px solid rgba(229, 62, 62, 0.4);
      background-color: rgba(229, 62, 62, 0.1);
      color: #e53e3e;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-logout:hover {
      background-color: #e53e3e;
      color: #ffffff;
    }

    .btn-logout:active { opacity: 0.85; }

    #image-file-input { display: none; }

    .toast {
      display: none;
      padding: 12px;
      border-radius: 8px;
      background: var(--green, #2E8B57);
      color: #fff;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 15px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <span class="back-btn" aria-hidden="true">
        <i data-lucide="arrow-left"></i>
      </span>
      <span class="header-title">Profile Settings</span>
    </header>

    <div class="card">

      <div class="avatar-wrapper">
        <div class="avatar-container-rel">
          <div id="avatar-container" class="avatar-large">
            <i data-lucide="user"></i>
          </div>
          <button type="button" class="camera-btn" id="camera-trigger" title="Change Photo">
            <i data-lucide="camera" style="width:16px; height:16px;"></i>
          </button>
        </div>

        <input type="file" id="image-file-input" accept="image/*">

        <span id="user-email-display" class="avatar-email">
          Loading email...
        </span>
      </div>

      <form id="profile-form">
        <div class="form-group">
          <label class="form-label">Full Name / Display Name</label>
          <input type="text" id="input-name" class="form-input" placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label class="form-label">Exam Target</label>
          <select id="input-target" class="form-select">
            <option value="WAEC / WASSCE">WAEC / WASSCE</option>
            <option value="UTME / JAMB">UTME / JAMB</option>
            <option value="NECO">NECO</option>
            <option value="POST-UTME">POST-UTME</option>
            <option value="General Study">General Study</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">About / Bio</label>
          <textarea id="input-bio" class="form-textarea" placeholder="Tell us a bit about your academic goals..."></textarea>
        </div>

        <button type="submit" id="btn-submit" class="btn-save">
          <i data-lucide="save"></i>
          Save Profile
        </button>
      </form>

      <button type="button" id="btn-logout" class="btn-logout">
        <i data-lucide="log-out"></i>
        Log Out
      </button>

      <div id="status-toast" class="toast">
        Profile updated successfully!
      </div>

    </div>
  </div>

  <script src="idb.js"></script>
  <script src="theme.js"></script>
  <script src="back-handler.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const CLOUDINARY_CLOUD_NAME = "dpr182siv";
    const CLOUDINARY_UPLOAD_PRESET = "flexi_unsigned";

    const firebaseConfig = {
      apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",
      authDomain: "flexieduconsult.com.ng",
      projectId: "waec2026jamb2027"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUid = null;
    let currentPhotoURL = "";
    let isOfflineMode = !navigator.onLine;

    // =========================================================
    // LOCAL STORAGE HELPERS
    // =========================================================

    async function getLocalItem(key) {
      try {
        if (typeof IDB !== "undefined" && typeof IDB.getItem === "function") {
          const value = await IDB.getItem(key);
          if (value !== null && value !== undefined && value !== "") {
            return value;
          }
        }
      } catch (e) {
        console.warn("IDB read failed:", e);
      }
      return localStorage.getItem(key);
    }

    async function setLocalItem(key, value) {
      try {
        if (typeof IDB !== "undefined" && typeof IDB.setItem === "function") {
          await IDB.setItem(key, value);
          return;
        }
      } catch (e) {
        console.warn("IDB write failed:", e);
      }
      localStorage.setItem(key, value);
    }

    async function clearLocalUser() {
      try {
        if (typeof IDB !== "undefined") {
          await IDB.setItem("userName", "");
          await IDB.setItem("userEmail", "");
          await IDB.setItem("userUid", "");
          await IDB.setItem("profileTarget", "");
          await IDB.setItem("profileBio", "");
          await IDB.setItem("profilePhoto", "");
        }
      } catch (e) {}

      localStorage.removeItem("userName");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("userUid");
      localStorage.removeItem("profileTarget");
      localStorage.removeItem("profileBio");
      localStorage.removeItem("profilePhoto");
    }

    // =========================================================
    // APPLY CACHED PROFILE TO UI (runs first, always)
    // =========================================================

    async function applyCachedProfile() {
      const name = await getLocalItem("userName");
      const email = await getLocalItem("userEmail");
      const uid = await getLocalItem("userUid");
      const savedTarget = await getLocalItem("profileTarget") || "UTME / JAMB";
      const savedBio = await getLocalItem("profileBio") || "";
      const savedPhoto = await getLocalItem("profilePhoto") || "";

      // Show whatever we have — never leave "Loading..." if cache exists
      document.getElementById("user-email-display").textContent =
        email || (uid ? "Signed in (offline)" : "Not signed in");

      document.getElementById("input-name").value =
        name || (email ? email.split("@")[0] : "");

      document.getElementById("input-target").value = savedTarget;
      document.getElementById("input-bio").value = savedBio;

      currentPhotoURL = savedPhoto;
      currentUid = uid || currentUid || "offline-user";

      updateAvatarDisplay(currentPhotoURL);

      // True if we have any cached identity
      return !!(name || email || uid);
    }

    // =========================================================
    // CACHE-FIRST BOOT
    // Show local data immediately, then try Firebase update
    // =========================================================

    (async function boot() {
      const hasCache = await applyCachedProfile();

      if (!hasCache && !navigator.onLine) {
        // No cache and offline — still stay on page, just empty form
        document.getElementById("user-email-display").textContent = "Offline — no cached profile";
      }
    })();

    // =========================================================
    // FIREBASE AUTH — update cache when online
    // =========================================================

    onAuthStateChanged(auth, async (currentUser) => {
      if (!currentUser) {
        // Not signed in on Firebase. Keep showing cache if we have it.
        const hasCache = await applyCachedProfile();
        isOfflineMode = true;

        if (!hasCache) {
          // Optional: only redirect if you really want login forced
          // window.location.href = "index.html";
        }
        return;
      }

      // Signed in (works offline too if Firebase Auth cache is present)
      isOfflineMode = !navigator.onLine;
      currentUid = currentUser.uid;

      // Always refresh email from auth object (available offline from Auth cache)
      const authEmail = currentUser.email || "";
      if (authEmail) {
        document.getElementById("user-email-display").textContent = authEmail;
        await setLocalItem("userEmail", authEmail);
      }
      await setLocalItem("userUid", currentUid);

      // Try Firestore only when online (or when it responds quickly)
      try {
        if (!navigator.onLine) {
          // Stay on cached profile fields; email already updated above
          await applyCachedProfile();
          if (authEmail) {
            document.getElementById("user-email-display").textContent = authEmail;
          }
          return;
        }

        let docSnap = await getDoc(doc(db, "profiles", currentUid));
        if (!docSnap.exists()) {
          docSnap = await getDoc(doc(db, "users", currentUid));
        }

        if (docSnap.exists()) {
          const data = docSnap.data();

          const name =
            data.displayName ||
            data.name ||
            currentUser.displayName ||
            "";

          currentPhotoURL =
            data.photoURL ||
            data.photoUrl ||
            currentUser.photoURL ||
            "";

          const target = data.targetExam || data.examTarget || "UTME / JAMB";
          const bio = data.bio || data.about || "";

          document.getElementById("input-name").value = name;
          document.getElementById("input-target").value = target;
          document.getElementById("input-bio").value = bio;
          document.getElementById("user-email-display").textContent =
            currentUser.email || "No email linked";

          // Update cache so offline works next time
          await setLocalItem("userName", name);
          await setLocalItem("userEmail", currentUser.email || "");
          await setLocalItem("userUid", currentUid);
          await setLocalItem("profileTarget", target);
          await setLocalItem("profileBio", bio);
          await setLocalItem("profilePhoto", currentPhotoURL);

          updateAvatarDisplay(currentPhotoURL);
        } else {
          const defaultName =
            currentUser.displayName ||
            (currentUser.email ? currentUser.email.split("@")[0] : "Member");

          document.getElementById("input-name").value = defaultName;
          document.getElementById("user-email-display").textContent =
            currentUser.email || "No email linked";

          currentPhotoURL = currentUser.photoURL || "";
          updateAvatarDisplay(currentPhotoURL);

          await setLocalItem("userName", defaultName);
          await setLocalItem("userEmail", currentUser.email || "");
          await setLocalItem("userUid", currentUid);
        }
      } catch (err) {
        console.error("Error loading profile (using cache):", err);
        // Keep / re-apply cache — do not clear the UI
        await applyCachedProfile();
        if (currentUser.email) {
          document.getElementById("user-email-display").textContent = currentUser.email;
        }
      }
    });

    // =========================================================
    // IMAGE UPLOAD
    // =========================================================

    const cameraBtn = document.getElementById("camera-trigger");
    const fileInput = document.getElementById("image-file-input");

    cameraBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!navigator.onLine) {
        showToast("Image upload needs internet. Profile text can still be saved offline.", true);
        return;
      }

      showToast("Uploading image...", false);

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      try {
        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
          { method: "POST", body: formData }
        );
        const data = await response.json();

        if (data.secure_url) {
          currentPhotoURL = data.secure_url;
          updateAvatarDisplay(currentPhotoURL);
          await setLocalItem("profilePhoto", currentPhotoURL);
          showToast("Photo uploaded! Click Save Profile to submit.", false);
        } else {
          throw new Error("Upload failed");
        }
      } catch (err) {
        console.error("Cloudinary upload error:", err);
        showToast("Image upload failed. Please try again.", true);
      }
    });

    // =========================================================
    // SAVE PROFILE — always cache locally; sync online if possible
    // =========================================================

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("btn-submit");
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving...";

      const updatedName = document.getElementById("input-name").value.trim();
      const updatedTarget = document.getElementById("input-target").value;
      const updatedBio = document.getElementById("input-bio").value.trim();

      try {
        // Always save locally first (works offline)
        await setLocalItem("userName", updatedName);
        await setLocalItem("profileTarget", updatedTarget);
        await setLocalItem("profileBio", updatedBio);
        await setLocalItem("profilePhoto", currentPhotoURL);

        if (currentUid && currentUid !== "offline-user" && navigator.onLine) {
          try {
            await setDoc(
              doc(db, "profiles", currentUid),
              {
                displayName: updatedName,
                targetExam: updatedTarget,
                photoURL: currentPhotoURL,
                bio: updatedBio,
                updatedAt: new Date()
              },
              { merge: true }
            );
            showToast("Profile saved successfully!");
          } catch (syncErr) {
            console.warn("Online save failed, kept local:", syncErr);
            showToast("Profile saved on this device (will sync when online)");
          }
        } else {
          showToast("Profile saved on this device (offline)");
        }

        updateAvatarDisplay(currentPhotoURL);
      } catch (err) {
        console.error("Error saving profile:", err);
        showToast("Failed to save changes.", true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="save"></i> Save Profile`;
        lucide.createIcons();
      }
    });

    // =========================================================
    // LOG OUT
    // =========================================================

    document.getElementById("btn-logout").addEventListener("click", async () => {
      const logoutBtn = document.getElementById("btn-logout");
      logoutBtn.disabled = true;
      logoutBtn.innerText = "Logging out...";

      try {
        await clearLocalUser();
        try {
          await signOut(auth);
        } catch (e) {
          console.warn("Firebase signOut failed (probably offline):", e);
        }
        window.location.href = "index.html";
      } catch (err) {
        console.error("Logout error:", err);
        showToast("Logout failed. Please try again.", true);
        logoutBtn.disabled = false;
        logoutBtn.innerHTML = `<i data-lucide="log-out"></i> Log Out`;
        lucide.createIcons();
      }
    });

    // =========================================================
    // AVATAR + TOAST
    // =========================================================

    function updateAvatarDisplay(photoURL) {
      const container = document.getElementById("avatar-container");
      if (photoURL) {
        container.innerHTML = `<img src="${escapeHTML(photoURL)}" alt="Profile">`;
      } else {
        container.innerHTML = `<i data-lucide="user"></i>`;
        lucide.createIcons();
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("status-toast");
      toast.textContent = msg;
      toast.style.background = isError ? "#e53e3e" : "var(--green, #2E8B57)";
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function escapeHTML(str) {
      return typeof str === "string"
        ? str.replace(/[&<>'"]/g, tag => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
          }[tag] || tag))
        : "";
    }

    lucide.createIcons();
  </script>

</body>
</html>

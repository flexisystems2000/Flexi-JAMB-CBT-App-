<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Study Past Questions - Flexi Educational Consult</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#008000">
    <link rel="stylesheet" href="theme.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg, #f4f6f8);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 600px;
            margin: auto;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        .container.blurred {
            filter: blur(10px);
            pointer-events: none;
            user-select: none;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        /* Back Button adapts dynamically to current theme */
        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--card-bg, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text, #333333);
            text-decoration: none;
            box-shadow: var(--card-shadow, 0 4px 12px rgba(0,0,0,0.08));
            border: 1px solid var(--border-color, transparent);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark .back-btn {
            background-color: #1e1e1e;
            color: #e0e0e0;
            border-color: #333333;
        }

        .header-title {
            margin-bottom: 20px;
        }

        .header-title h1 {
            color: #008000;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .header-title p {
            color: var(--subtext, #666666);
            font-size: 0.9rem;
        }

        /* Mode Toggle Switch (Questions / Videos) */
        .toggle-switch {
            display: flex;
            background: var(--card-bg, #e4e6eb);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 25px;
            width: fit-content;
        }

        body.dark .toggle-switch {
            background: #252525;
        }

        .toggle-option {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--subtext, #777777);
            transition: all 0.3s ease;
        }

        .toggle-option.active {
            background: var(--card-bg, #ffffff);
            color: #008000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        body.dark .toggle-option.active {
            background: #333333;
            color: #00e600;
        }

        /* Form Controls Dark Theme Adaptation */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text, #333333);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--border-color, #dddddd);
            background-color: var(--card-bg, #ffffff);
            color: var(--text, #222222);
            font-size: 0.95rem;
            outline: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23888888" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position-x: 96%;
            background-position-y: 50%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Soft dark background for select options bar */
        body.dark .form-control {
            background-color: #1e1e1e;
            border-color: #333333;
            color: #e0e0e0;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23aaaaaa" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
        }

        .form-control option {
            background-color: var(--card-bg, #ffffff);
            color: var(--text, #222222);
        }

        body.dark .form-control option {
            background-color: #222222;
            color: #e0e0e0;
        }

        .form-control option:disabled {
            color: #888888;
            opacity: 0.6;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #008000, #004d00);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: var(--card-shadow, 0 4px 12px rgba(0,0,0,0.15));
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* CUSTOM ALERT MODAL STYLES */
        .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .custom-alert-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-alert-box {
            width: 90%;
            max-width: 360px;
            background: var(--card-bg, #ffffff);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        body.dark .custom-alert-box {
            background: #222222;
            color: #ffffff;
        }

        .custom-alert-overlay.active .custom-alert-box {
            transform: translateY(0);
        }

        .custom-alert-icon {
            font-size: 2.8rem;
            color: #008000;
            margin-bottom: 12px;
        }

        .custom-alert-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text, #222222);
        }

        body.dark .custom-alert-title {
            color: #ffffff;
        }

        .custom-alert-msg {
            font-size: 0.95rem;
            color: var(--subtext, #666666);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        body.dark .custom-alert-msg {
            color: #aaaaaa;
        }

        .custom-alert-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #008000;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .custom-alert-btn:active {
            opacity: 0.85;
        }

        /* LOGIN IFRAME MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            backdrop-filter: blur(6px);
        }

        .modal-card {
            width: 95%;
            max-width: 440px;
            height: 90vh;
            max-height: 700px;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .modal-card iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width: 480px) {
            body { padding: 15px; }
            .header-title h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="container" id="pageContainer">
    <div class="top-bar">
        <a href="study.html" class="back-btn" aria-label="Go Back">
            <box-icon name="left-arrow-alt" size="sm"></box-icon>
        </a>
    </div>

    <div class="header-title">
        <h1>Study Past Questions</h1>
        <p>Get all exam questions from 1978 till date</p>
    </div>

    <div class="toggle-switch">
        <div class="toggle-option active" id="optQuestions">Questions</div>
        <div class="toggle-option" id="optVideos">Videos</div>
    </div>

    <form id="studyForm">
        <div class="form-group">
            <label for="subjectSelect">Subject</label>
            <select id="subjectSelect" class="form-control" required></select>
        </div>

        <div class="form-group">
            <label for="examTypeSelect">Examination Type</label>
            <select id="examTypeSelect" class="form-control">
                <option value="JAMB" selected>JAMB</option>
                <option value="WAEC" disabled>WAEC (Disabled)</option>
                <option value="NECO" disabled>NECO (Disabled)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="examYearSelect">Examination Year</label>
            <select id="examYearSelect" class="form-control">
                <option value="All">All</option>
            </select>
        </div>

        <div class="form-group">
            <label for="questionTypeSelect">Question type</label>
            <select id="questionTypeSelect" class="form-control">
                <option value="Theory">Theory</option>
                <option value="Objectives">Objectives</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topicSelect">Question Topic</label>
            <select id="topicSelect" class="form-control">
                <option value="All">All</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Start Study</button>
    </form>
</div>

<!-- BEAUTIFUL CUSTOM ALERT MODAL -->
<div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <div class="custom-alert-icon">
            <box-icon name="info-circle" color="#008000" size="lg"></box-icon>
        </div>
        <div class="custom-alert-title" id="customAlertTitle">Notification</div>
        <div class="custom-alert-msg" id="customAlertMsg">Something happened.</div>
        <button class="custom-alert-btn" id="customAlertClose">Got It</button>
    </div>
</div>

<!-- LOGIN MODAL IFRAME OVERLAY -->
<div id="loginModal" class="modal-overlay hidden">
    <div class="modal-card">
        <iframe id="loginIframe" src="" title="Login Portal"></iframe>
    </div>
</div>

<script src="idb.js"></script>
<script src="theme.js"></script>
<script src="back-handler.js"></script>
<script>
    // Clean mapped subject list pointing directly to the question_bank directory
    const SUBJECT_MAP = [
        { label: "English Language", file: "question_bank/use_of_english.json" },
        { label: "Account", file: "question_bank/accounting.json" },
        { label: "Arabic", file: "question_bank/arabic.json" },
        { label: "Biology", file: "question_bank/biology.json" },
        { label: "Chemistry", file: "question_bank/chemistry.json" },
        { label: "Christian Religious Studies (CRS)", file: "question_bank/christian_religious_studies__crs_.json" },
        { label: "Commerce", file: "question_bank/commerce.json" },
        { label: "Computer Studies", file: "question_bank/computer_studies.json" },
        { label: "Economics", file: "question_bank/economics.json" },
        { label: "Fine Arts", file: "question_bank/fine_art.json" },
        { label: "Government", file: "question_bank/government.json" },
        { label: "Literature In English", file: "question_bank/literature_in_english.json" },
        { label: "Mathematics", file: "question_bank/mathematics.json" },
        { label: "Physics", file: "question_bank/physics.json" },
        { label: "Yoruba", file: "question_bank/yoruba.json" }
    ];

    function showCustomAlert(title, message) {
        const alertModal = document.getElementById("customAlert");
        document.getElementById("customAlertTitle").textContent = title;
        document.getElementById("customAlertMsg").textContent = message;
        alertModal.classList.add("active");
    }

    document.getElementById("customAlertClose").addEventListener("click", () => {
        document.getElementById("customAlert").classList.remove("active");
    });

    document.addEventListener("DOMContentLoaded", () => {
        // Populate Subjects Dropdown cleanly
        const subjectSelect = document.getElementById("subjectSelect");
        SUBJECT_MAP.forEach(item => {
            const option = document.createElement("option");
            option.value = item.file;
            option.textContent = item.label;
            subjectSelect.appendChild(option);
        });

        // Populate Years Dropdown (1978 to 2025, excluding 2026)
        const yearSelect = document.getElementById("examYearSelect");
        const currentYear = new Date().getFullYear();
        for (let year = currentYear; year >= 1978; year--) {
            if (year === 2026) continue; // Explicitly skip year 2026
            const option = document.createElement("option");
            option.value = year;
            option.textContent = year;
            yearSelect.appendChild(option);
        }

        // Direct routing for Videos option click
        const optVideos = document.getElementById("optVideos");
        optVideos.addEventListener("click", () => {
            window.location.href = "video.html";
        });

        // Form Submit Handler
        document.getElementById("studyForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const selectedFile = subjectSelect.value;
            const examType = document.getElementById("examTypeSelect").value;
            const year = yearSelect.value;
            const qType = document.getElementById("questionTypeSelect").value;
            const topic = document.getElementById("topicSelect").value;

            if (!selectedFile) {
                showCustomAlert("Selection Missing", "Please select a subject to proceed.");
                return;
            }

            // Intercept Theory selection and show custom alert
            if (qType === "Theory") {
                showCustomAlert(
                    "Feature Unavailable", 
                    "Theory questions are currently not supported in this version. Please select Objectives to proceed."
                );
                return;
            }

            window.location.href = `practice.html?file=${encodeURIComponent(selectedFile)}&type=${encodeURIComponent(examType)}&year=${encodeURIComponent(year)}&qtype=${encodeURIComponent(qType)}&topic=${encodeURIComponent(topic)}`;
        });
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js');
        });
    }
</script>

<!-- FIREBASE AUTH CHECK & IFRAME POP-UP LOGIC -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",
        authDomain: "auth.flexieduconsult.com.ng",
        projectId: "waec2026jamb2027",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const LOGIN_FILE_PATH = "login.html";

    const modal = document.getElementById('loginModal');
    const iframe = document.getElementById('loginIframe');
    const pageContainer = document.getElementById('pageContainer');

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            showLoginModal();
        } else {
            hideLoginModal();
        }
    });

    function showLoginModal() {
        if (!iframe.src || !iframe.src.includes(LOGIN_FILE_PATH)) {
            iframe.src = LOGIN_FILE_PATH;
        }
        modal.classList.remove('hidden');
        pageContainer.classList.add('blurred');
    }

    function hideLoginModal() {
        modal.classList.add('hidden');
        pageContainer.classList.remove('blurred');
        iframe.src = "";
    }

    window.addEventListener('message', (event) => {
        if (event.data?.type === 'AUTH_SUCCESS') {
            hideLoginModal();
        }
    });
</script>
</body>
</html>

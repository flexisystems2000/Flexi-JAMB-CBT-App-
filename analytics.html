<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Performance Analytics - Flexi Educational Consult</title>
<script>
(function () {
    try {
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    } catch (e) {}
})();
</script>
  <link rel="stylesheet" href="theme.css">
  <script src="lucide.min.js"></script>
  <script src="chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding-bottom: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--header);
      padding: 10px 0;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background-color: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--subtext);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-icon {
      color: var(--green, #2E8B57);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat-desc {
      font-size: 0.75rem;
      color: var(--subtext);
    }

    .card {
      background-color: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      padding: 18px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 220px;
    }

    .attempts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .attempt-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 8px;
      background-color: var(--bg);
      border: 1px solid var(--border);
    }

    .attempt-info {
      display: flex;
      flex-direction: column;
    }

    .attempt-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .attempt-meta {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 2px;
    }

    .attempt-score {
      font-size: 1rem;
      font-weight: 700;
      color: var(--green, #2E8B57);
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--subtext);
      font-size: 0.88rem;
    }

    .sync-hint {
      font-size: 0.75rem;
      color: var(--subtext);
      text-align: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="javascript:void(0)" class="back-btn" onclick="FlexiBack.goBack('more.html')">
        <i data-lucide="arrow-left"></i>
      </a>
      <span class="header-title">Performance Analytics</span>
    </header>

    <p id="sync-hint" class="sync-hint">Loading local records...</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span>Avg Accuracy</span>
          <i data-lucide="target" class="stat-icon" style="width:18px; height:18px;"></i>
        </div>
        <div class="stat-value" id="stat-accuracy">0%</div>
        <div class="stat-desc">Target: 80%+</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Tests Taken</span>
          <i data-lucide="file-check-2" class="stat-icon" style="width:18px; height:18px;"></i>
        </div>
        <div class="stat-value" id="stat-tests">0</div>
        <div class="stat-desc">Completed CBT sessions</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Avg Speed</span>
          <i data-lucide="zap" class="stat-icon" style="width:18px; height:18px;"></i>
        </div>
        <div class="stat-value" id="stat-speed">0s</div>
        <div class="stat-desc">Per question</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Top Subject</span>
          <i data-lucide="award" class="stat-icon" style="width:18px; height:18px;"></i>
        </div>
        <div class="stat-value" id="stat-subject" style="font-size: 1.1rem; line-height: 1.8rem;">None</div>
        <div class="stat-desc">Highest score rate</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <i data-lucide="trending-up" class="stat-icon" style="width:18px; height:18px;"></i>
        Recent Score Trajectory
      </div>
      <div class="chart-container">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <i data-lucide="history" class="stat-icon" style="width:18px; height:18px;"></i>
        Recent CBT Attempts
      </div>
      <div id="attempts-list" class="attempts-list">
        <div class="empty-state">
          Loading CBT records...
        </div>
      </div>
    </div>
  </div>

  <script src="idb.js"></script>
  <script src="theme.js"></script>
  <script src="back-handler.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",
      authDomain: "flexieduconsult.com.ng",
      databaseURL: "https://waec2026jamb2027-default-rtdb.firebaseio.com",
      projectId: "waec2026jamb2027"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let chartInstance = null;
    const HISTORY_KEY = "cbtHistory";
    const MAX_HISTORY = 50;

    // =========================================================
    // LOCAL STORAGE HELPERS
    // =========================================================

    async function getLocalItem(key) {
      try {
        if (typeof IDB !== "undefined" && typeof IDB.getItem === "function") {
          const value = await IDB.getItem(key);
          if (value !== null && value !== undefined && value !== "") {
            return value;
          }
        }
      } catch (e) {
        console.warn("IDB read failed:", e);
      }
      return localStorage.getItem(key);
    }

    async function setLocalItem(key, value) {
      try {
        if (typeof IDB !== "undefined" && typeof IDB.setItem === "function") {
          await IDB.setItem(key, value);
          return;
        }
      } catch (e) {
        console.warn("IDB write failed:", e);
      }
      localStorage.setItem(key, value);
    }

    function normalizeAttempt(raw) {
      if (!raw || typeof raw !== "object") return null;

      const score = Number(raw.score ?? raw.rawScore ?? 0);
      const total = Number(raw.total ?? raw.totalQuestions ?? 0);
      let percentage = Number(raw.percentage);

      if (!Number.isFinite(percentage)) {
        percentage = total > 0 ? Math.round((score / total) * 100) : Number(raw.score) || 0;
      }

      const timestamp = Number(raw.timestamp) || Date.now();
      const exam = raw.exam || raw.examName || raw.displayExamName || "CBT Exam";
      const speedSec = Number(raw.speedSec) || 0;
      const uid = raw.uid || "";

      // Stable-ish id for dedupe
      const id = raw.id || `\( {uid}| \){exam}|\( {timestamp}| \){percentage}`;

      return {
        id,
        uid,
        exam,
        score,
        total,
        percentage,
        speedSec,
        timestamp,
        subjectScores: raw.subjectScores || {}
      };
    }

    async function loadLocalHistory() {
      let history = [];

      try {
        const raw = await getLocalItem(HISTORY_KEY);
        if (raw) {
          const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
          if (Array.isArray(parsed)) {
            history = parsed.map(normalizeAttempt).filter(Boolean);
          }
        }
      } catch (e) {
        console.warn("Could not parse cbtHistory:", e);
      }

      // Also fold in latestExamResult / pendingLeaderboardSync if present
      for (const key of ["latestExamResult", "pendingLeaderboardSync"]) {
        try {
          const raw = await getLocalItem(key);
          if (!raw) continue;
          const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
          const attempt = normalizeAttempt(parsed);
          if (attempt) {
            history.push(attempt);
          }
        } catch (e) {}
      }

      // Dedupe by id, keep newest first
      const map = new Map();
      history
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
        .forEach(item => {
          if (!map.has(item.id)) {
            map.set(item.id, item);
          }
        });

      return Array.from(map.values()).slice(0, MAX_HISTORY);
    }

    async function saveLocalHistory(attempts) {
      const cleaned = (attempts || [])
        .map(normalizeAttempt)
        .filter(Boolean)
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
        .slice(0, MAX_HISTORY);

      await setLocalItem(HISTORY_KEY, JSON.stringify(cleaned));
      return cleaned;
    }

    function setSyncHint(text) {
      const el = document.getElementById("sync-hint");
      if (el) el.textContent = text;
    }

    // =========================================================
    // RENDER
    // =========================================================

    function renderAnalytics(data) {
      const listContainer = document.getElementById("attempts-list");
      const attempts = Array.isArray(data) ? data : [];

      if (attempts.length === 0) {
        document.getElementById("stat-accuracy").textContent = "0%";
        document.getElementById("stat-tests").textContent = "0";
        document.getElementById("stat-speed").textContent = "0s";
        document.getElementById("stat-subject").textContent = "None";

        renderChart([]);

        listContainer.innerHTML = `
          <div class="empty-state">
            No CBT practice records found on this device yet.
            Complete a test to view your performance data!
          </div>
        `;
        return;
      }

      const totalTests = attempts.length;
      let totalPercentage = 0;
      let totalSpeed = 0;
      const subjectMap = {};

      attempts.forEach(item => {
        const pct = Number(item.percentage) || 0;
        totalPercentage += pct;
        totalSpeed += Number(item.speedSec) || 0;

        const subj = item.exam || "CBT Exam";
        if (!subjectMap[subj]) subjectMap[subj] = { count: 0, totalPct: 0 };
        subjectMap[subj].count += 1;
        subjectMap[subj].totalPct += pct;
      });

      const avgAccuracy = Math.round(totalPercentage / totalTests);
      const avgSpeed = Math.round(totalSpeed / totalTests);

      let topSubject = "None";
      let highestAvg = -1;
      Object.keys(subjectMap).forEach(subj => {
        const avg = subjectMap[subj].totalPct / subjectMap[subj].count;
        if (avg > highestAvg) {
          highestAvg = avg;
          topSubject = subj;
        }
      });

      document.getElementById("stat-accuracy").textContent = `${avgAccuracy}%`;
      document.getElementById("stat-tests").textContent = totalTests;
      document.getElementById("stat-speed").textContent = `${avgSpeed}s`;
      document.getElementById("stat-subject").textContent = topSubject;

      // Chart: oldest → newest for trajectory
      renderChart(attempts.slice().reverse());

      listContainer.innerHTML = "";
      attempts.forEach(item => {
        const pct = item.percentage || 0;
        const subj = item.exam || "CBT Exam";
        const dateStr = item.timestamp
          ? new Date(item.timestamp).toLocaleDateString()
          : "Recent";

        const div = document.createElement("div");
        div.className = "attempt-item";
        div.innerHTML = `
          <div class="attempt-info">
            <span class="attempt-title">${escapeHTML(subj)}</span>
            <span class="attempt-meta">${escapeHTML(dateStr)} • ${item.speedSec || 0}s / ques</span>
          </div>
          <div class="attempt-score">${pct}%</div>
        `;
        listContainer.appendChild(div);
      });
    }

    function renderChart(items) {
      const ctx = document.getElementById("scoreChart").getContext("2d");
      const isDark =
        document.body.classList.contains("dark") ||
        document.documentElement.classList.contains("dark");

      const labels = items.length > 0 ? items.map((_, i) => `Test ${i + 1}`) : ["Start"];
      const scores = items.length > 0
        ? items.map(item => item.percentage || 0)
        : [0];

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Score (%)",
            data: scores,
            borderColor: "#2E8B57",
            backgroundColor: "rgba(46, 139, 87, 0.12)",
            borderWidth: 2.5,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: "#2E8B57",
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              min: 0,
              max: 100,
              grid: { color: isDark ? "rgba(255, 255, 255, 0.08)" : "rgba(0, 0, 0, 0.06)" },
              ticks: { color: isDark ? "#A1A1AA" : "#6B7280" }
            },
            x: {
              grid: { display: false },
              ticks: { color: isDark ? "#A1A1AA" : "#6B7280" }
            }
          }
        }
      });
    }

    function escapeHTML(str) {
      return typeof str === "string"
        ? str.replace(/[&<>'"]/g, tag => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
          }[tag] || tag))
        : "";
    }

    // =========================================================
    // CACHE-FIRST BOOT
    // =========================================================

    let localAttempts = [];

    (async function bootFromCache() {
      localAttempts = await loadLocalHistory();
      renderAnalytics(localAttempts);

      if (localAttempts.length > 0) {
        setSyncHint(
          navigator.onLine
            ? "Showing cached results. Updating from cloud if available..."
            : "Offline — showing results saved on this device"
        );
      } else {
        setSyncHint(
          navigator.onLine
            ? "No local history yet. Checking cloud..."
            : "Offline — no CBT records cached on this device yet"
        );
      }
    })();

    // =========================================================
    // ONLINE: merge Firestore into local cache
    // =========================================================

    onAuthStateChanged(auth, async (currentUser) => {
      // Never force-login offline. Local data is enough.
      if (!currentUser) {
        if (!navigator.onLine) {
          setSyncHint("Offline — showing results saved on this device");
        } else {
          setSyncHint(
            localAttempts.length > 0
              ? "Showing device history. Sign in to sync cloud scores."
              : "Sign in to sync your scores from the cloud."
          );
        }
        return;
      }

      if (!navigator.onLine) {
        setSyncHint("Offline — showing results saved on this device");
        return;
      }

      try {
        const snap = await getDocs(collection(db, "leaderboard"));
        const cloudAttempts = [];

        if (!snap.empty) {
          snap.forEach(docSnap => {
            const val = docSnap.data();
            if (val && val.uid === currentUser.uid) {
              cloudAttempts.push(
                normalizeAttempt({
                  ...val,
                  id: docSnap.id,
                  score: val.rawScore ?? val.score,
                  total: val.totalQuestions ?? val.total
                })
              );
            }
          });
        }

        // Merge local + cloud, dedupe, save cache
        const mergedMap = new Map();
        [...localAttempts, ...cloudAttempts]
          .filter(Boolean)
          .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
          .forEach(item => {
            if (!mergedMap.has(item.id)) {
              mergedMap.set(item.id, item);
            }
          });

        const merged = Array.from(mergedMap.values()).slice(0, MAX_HISTORY);
        localAttempts = await saveLocalHistory(merged);
        renderAnalytics(localAttempts);

        setSyncHint(
          localAttempts.length > 0
            ? "Up to date — local + cloud history"
            : "No CBT practice records found yet"
        );
      } catch (err) {
        console.error("Cloud analytics fetch failed, keeping local:", err);
        setSyncHint("Could not reach cloud — showing results saved on this device");
        renderAnalytics(localAttempts);
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>

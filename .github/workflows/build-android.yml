name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='google-services.json' \
            ./ www/

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied successfully"
          else
            echo "WARNING: google-services.json not found"
          fi

      - name: Inject Google App ID into strings.xml
        run: |
          mkdir -p android/app/src/main/res/values
          cat <<EOF > android/app/src/main/res/values/strings_google.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="server_client_id">465373608641-imaii3evs8obkjoj50ncjkn3fj3ff00v.apps.googleusercontent.com</string>
          </resources>
          EOF

      - name: Force higher Android SDK & Gradle versions
        run: |
          # Update variables.gradle or build.gradle to use higher SDK
          sed -i 's/compileSdkVersion = [0-9]\+/compileSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = [0-9]\+/targetSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/compileSdk [0-9]\+/compileSdk 36/' android/app/build.gradle || true
          sed -i 's/targetSdk [0-9]\+/targetSdk 36/' android/app/build.gradle || true

          # Update Android Gradle Plugin
          sed -i 's/com.android.tools.build:gradle:[0-9.]\+/com.android.tools.build:gradle:8.9.1/' android/build.gradle || true
          sed -i 's/classpath("com.android.tools.build:gradle:[0-9.]\+")/classpath("com.android.tools.build:gradle:8.9.1")/' android/build.gradle || true

          echo "=== Updated build files ==="
          cat android/variables.gradle || true
          head -40 android/build.gradle || true

      - name: Generate icons & splash
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#000000' \
            --splashBackgroundColor '#0A1F6E' \
            --logoSplashScale 0.3 || true

      - name: Apply Google Services plugin
        run: |
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi

      - name: Sync
        run: npx cap sync android

      - name: Decode Permanent Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
            echo "Permanent keystore decoded successfully."
          else
            echo "WARNING: KEYSTORE_BASE64 secret not found. Falling back to debug keystore."
          fi

      - name: Print Keystore Fingerprints (SHA-1 & SHA-256)
        run: |
          echo "=================== YOUR SHA-1 FINGERPRINT ==================="
          if [ -f android/app/release-key.jks ]; then
            keytool -list -v -keystore android/app/release-key.jks \
              -alias "${{ secrets.KEY_ALIAS }}" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -E "SHA1:|SHA256:" || true
          else
            keytool -list -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android | grep -E "SHA1:|SHA256:" || true
          fi
          echo "=============================================================="

      - name: Build APK
        run: |
          cd android
          if [ -f app/release-key.jks ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=app/release-key.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} --stacktrace
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flexi-app
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

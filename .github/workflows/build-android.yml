name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: npm install

      # ============================================================
      # VERIFY CAPACITOR LOCAL NOTIFICATIONS PLUGIN
      # ============================================================
      - name: Verify Local Notifications plugin
        run: |
          echo "=== Checking Capacitor Local Notifications ==="

          if npm list @capacitor/local-notifications --depth=0; then
            echo "✅ @capacitor/local-notifications is installed"
          else
            echo "❌ @capacitor/local-notifications is NOT installed"
            echo "Check package.json"
            exit 1
          fi

      # ============================================================
      # PREPARE WEB ASSETS
      # ============================================================
      - name: Prepare web assets
        run: |
          mkdir -p www

          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='google-services.json' \
            ./ www/

      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform does not exist. Creating it..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # ============================================================
      # GENERATE ICONS & SPLASH
      # ============================================================
      - name: Generate Android icons and splash screen
        run: |
          echo "=== Checking resources folder ==="
          ls -lah resources/

          if [ ! -f "resources/icon.png" ]; then
            echo "❌ ERROR: resources/icon.png is missing!"
            exit 1
          fi

          if [ ! -f "resources/splash.png" ]; then
            echo "❌ ERROR: resources/splash.png is missing!"
            exit 1
          fi

          echo "=== Generating icons and splash from resources/ ==="

          npx capacitor-assets generate \
            --android \
            --assetPath resources

          echo "=== Verifying generated icons ==="

          ls -lah \
            android/app/src/main/res/mipmap-xxxhdpi/ \
            || echo "No icons generated"

      # ============================================================
      # COPY GOOGLE SERVICES
      # ============================================================
      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied successfully"
          else
            echo "WARNING: google-services.json not found"
          fi

      # ============================================================
      # ANDROID SDK / GRADLE VERSIONS
      # ============================================================
      - name: Force higher Android SDK & Gradle versions
        run: |
          sed -i 's/compileSdkVersion = [0-9]\+/compileSdkVersion = 36/' \
            android/variables.gradle || true

          sed -i 's/targetSdkVersion = [0-9]\+/targetSdkVersion = 36/' \
            android/variables.gradle || true

          sed -i 's/compileSdk [0-9]\+/compileSdk 36/' \
            android/app/build.gradle || true

          sed -i 's/targetSdk [0-9]\+/targetSdk 36/' \
            android/app/build.gradle || true

          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.9.1/' \
            android/build.gradle || true

          sed -i 's/classpath("com.android.tools.build:gradle:[0-9.]*")/classpath("com.android.tools.build:gradle:8.9.1")/' \
            android/build.gradle || true

      # ============================================================
      # APPLY GOOGLE SERVICES PLUGIN
      # ============================================================
      - name: Apply Google Services plugin
        run: |
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' \
              android/build.gradle
          fi

          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo 'apply plugin: "com.google.gms.google-services"' \
              >> android/app/build.gradle
          fi

      # ============================================================
      # SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor and native plugins
        run: |
          echo "=== Syncing Capacitor ==="

          npx cap sync android

          echo "=== Capacitor plugin list ==="
          npx cap ls

      # ============================================================
      # VERIFY LOCAL NOTIFICATIONS NATIVE PLUGIN
      # ============================================================
      - name: Verify Local Notifications native integration
        run: |
          echo "=== Searching Android project for Local Notifications ==="

          if grep -R "local-notifications" android \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            2>/dev/null | head -20; then

            echo "✅ Local Notifications native integration detected"

          else

            echo "⚠️ Could not find Local Notifications reference in generated Android files."
            echo "The build will continue, but inspect Capacitor sync output above."

          fi

      # ============================================================
      # ADD ANDROID NOTIFICATION PERMISSIONS
      # ============================================================
      - name: Configure Android notification permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not found!"
            exit 1
          fi

          echo "=== Configuring notification permissions ==="

          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]

          for permission in permissions:
              permission_name = permission.split('android:name="')[1].split('"')[0]

              if permission_name not in text:
                  marker = '<application'

                  if marker in text:
                      text = text.replace(
                          marker,
                          permission + '\n\n    ' + marker,
                          1
                      )
                  else:
                      raise SystemExit(
                          "Could not find <application> in AndroidManifest.xml"
                      )

          manifest.write_text(text, encoding="utf-8")

          print("Notification permissions configured successfully.")
          PY

          echo "=== AndroidManifest.xml notification permissions ==="

          grep -E \
            "POST_NOTIFICATIONS|SCHEDULE_EXACT_ALARM" \
            "$MANIFEST" \
            || true

      # ============================================================
      # GOOGLE APP ID & DEFAULT WEB CLIENT ID
      # ============================================================
      - name: Inject Google App ID into strings.xml
        run: |
          mkdir -p android/app/src/main/res/values

          cat <<EOF > android/app/src/main/res/values/strings_google.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="server_client_id">465373608641-imaii3evs8obkjoj50ncjkn3fj3ff00v.apps.googleusercontent.com</string>
              <string name="default_web_client_id">465373608641-imaii3evs8obkjoj50ncjkn3fj3ff00v.apps.googleusercontent.com</string>
          </resources>
          EOF

      # ============================================================
      # MAIN ACTIVITY WITH SOCIALLOGIN INTENT HANDLER
      # ============================================================
      - name: Inject Clean Capacitor v7 MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/flexiedu/consult

          cat > android/app/src/main/java/com/flexiedu/consult/MainActivity.java << 'EOF'
          package com.flexiedu.consult;

          import android.content.Intent;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;

          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity
                  implements ModifiedMainActivityForSocialLoginPlugin {

              @Override
              public void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (
                      requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN &&
                      requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX
                  ) {

                      PluginHandle pluginHandle =
                          getBridge().getPlugin("SocialLogin");

                      if (pluginHandle == null) {
                          return;
                      }

                      Plugin plugin =
                          pluginHandle.getInstance();

                      if (plugin instanceof SocialLoginPlugin) {

                          ((SocialLoginPlugin) plugin)
                              .handleGoogleLoginIntent(
                                  requestCode,
                                  data
                              );
                      }
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF

          echo "✅ SocialLogin-enabled MainActivity.java written"

      # ============================================================
      # VERIFY MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity injection
        run: |
          if [ -f "android/app/src/main/java/com/flexiedu/consult/MainActivity.java" ]; then
            echo "✅ MainActivity.java exists"
            cat android/app/src/main/java/com/flexiedu/consult/MainActivity.java
          else
            echo "❌ MainActivity.java NOT FOUND!"
            exit 1
          fi

      # ============================================================
      # VERIFY ANDROID NOTIFICATION PERMISSIONS
      # ============================================================
      - name: Verify Android notification configuration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "=== Notification permissions in manifest ==="

          if grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            echo "✅ POST_NOTIFICATIONS permission present"
          else
            echo "❌ POST_NOTIFICATIONS permission missing"
            exit 1
          fi

          if grep -q "android.permission.SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            echo "✅ SCHEDULE_EXACT_ALARM permission present"
          else
            echo "❌ SCHEDULE_EXACT_ALARM permission missing"
            exit 1
          fi

          echo "=== Final notification permission check ==="

          grep -E \
            "POST_NOTIFICATIONS|SCHEDULE_EXACT_ALARM" \
            "$MANIFEST"

      # ============================================================
      # SETUP / RESTORE KEYSTORE
      # ============================================================
      - name: Setup or Restore Keystore
        run: |
          mkdir -p ~/.android

          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then

            echo "Restoring permanent keystore from secrets..."

            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" \
              | base64 -d \
              > ~/.android/debug.keystore

          else

            echo "Generating new permanent keystore..."

            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "=================== COPY THIS BASE64 TEXT ==================="

            base64 -w 0 ~/.android/debug.keystore

            echo ""

            echo "============================================================="

          fi

      # ============================================================
      # PRINT KEYSTORE FINGERPRINTS
      # ============================================================
      - name: Print Keystore Fingerprints (SHA-1 & SHA-256)
        run: |
          echo "=================== YOUR SHA-1 & SHA-256 FINGERPRINTS ==================="

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "SHA1:|SHA256:"

          echo "========================================================================="

      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        run: |
          cd android

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK" ]; then
            echo "✅ APK successfully created"
            ls -lh "$APK"
          else
            echo "❌ APK was not created!"
            exit 1
          fi

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flexi-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

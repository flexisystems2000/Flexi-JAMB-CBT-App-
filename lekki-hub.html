<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Lekki Headmaster | Flexi CBT</title>
  <link rel="stylesheet" href="theme.css">

  <style>
    :root {
      --flexi-green: #008000;
      --flexi-navy: #003366;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* HEADER */
    header {
      background: var(--header);
      color: var(--text);
      padding: 13px 15px;
      border-bottom: 4px solid var(--flexi-green);
      box-shadow: var(--card-shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
    }

    .brand {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand span {
      color: var(--flexi-green);
    }

    /* MAIN */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(0, 128, 0, 0.12);
      color: var(--flexi-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .hero-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .hero h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--flexi-green);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .hero p {
      font-size: 0.85rem;
      color: var(--subtext);
      line-height: 1.5;
    }

    /* OPTION CARDS */
    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .option-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .option-card:active {
      transform: scale(0.98);
    }

    .option-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-icon.summary {
      background: rgba(0, 128, 0, 0.12);
      color: var(--flexi-green);
    }

    .option-icon.questions {
      background: rgba(0, 51, 102, 0.12);
      color: var(--flexi-navy);
    }

    .option-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .option-text h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .option-text p {
      font-size: 0.78rem;
      color: var(--subtext);
      line-height: 1.4;
    }

    .arrow {
      margin-left: auto;
      color: var(--subtext);
      font-size: 1.2rem;
      font-weight: 300;
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <button class="back-btn" onclick="FlexiBack.goBack('literature.html')" aria-label="Go Back">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="brand">
      FLEXI <span>CBT</span>
    </div>
  </div>
</header>

<div class="container">

  <div class="hero">
    <div class="hero-icon">
      <svg viewBox="0 0 24 24">
        <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.2.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/>
      </svg>
    </div>
    <h1>The Lekki Headmaster</h1>
    <p>Kabir Alabi Garba · JAMB 2026 Recommended Novel</p>
  </div>

  <div class="options">

    <!-- SUMMARY -->
    <a href="lekki-summary.html" class="option-card">
      <div class="option-icon summary">
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
        </svg>
      </div>
      <div class="option-text">
        <h2>Summary of The Lekki Headmaster</h2>
        <p>Chapter-by-chapter summary. Tap any chapter to read.</p>
      </div>
      <div class="arrow">›</div>
    </a>

    <!-- 300 QUESTIONS -->
    <a href="practice.html?file=the_lekki_headmaster.json&endless=1" class="option-card">
      <div class="option-icon questions">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
      </div>
      <div class="option-text">
        <h2>300 Likely Questions</h2>
        <p>Practice CBT-style questions. Keeps giving questions endlessly.</p>
      </div>
      <div class="arrow">›</div>
    </a>

  </div>

</div>

<script src="idb.js"></script>
<script src="theme.js"></script>
<script src="back-handler.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>User Profile</title>
    <script>
    (function () {
        try {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        header { height: 60px; background: var(--header); color: var(--text); display: flex; align-items: center; padding: 0 15px; gap: 15px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .back-btn { font-size: 1.4rem; cursor: pointer; text-decoration: none; color: inherit; background: none; border: none; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px 20px; text-align: center; box-shadow: var(--card-shadow); }
        .avatar-large { width: 110px; height: 110px; border-radius: 50%; background: var(--green, #2E8B57); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; font-weight: bold; margin: 0 auto 15px auto; overflow: hidden; border: 3px solid var(--green, #2E8B57); position: relative; }
        .avatar-large img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .avatar-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; font-weight: bold; color: #fff; }
        .user-name { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 5px; }
        .user-email { font-size: 0.9rem; color: var(--subtext); margin-bottom: 15px; }
        .user-status { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: rgba(46, 139, 87, 0.15); color: var(--green, #2E8B57); margin-bottom: 20px; }
        .info-group { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: left; margin-bottom: 20px; }
        .info-label { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--subtext); margin-bottom: 5px; }
        .info-value { font-size: 0.95rem; color: var(--text); word-break: break-word; }
        .action-btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-secondary { background: var(--btn-bg); color: var(--btn-color); border: 1px solid var(--border); }
        .loading-state, .error-state { padding: 40px 20px; text-align: center; color: var(--subtext); }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="FlexiBack.goBack('chat.html')">❮</button>
        <h3>Member Profile</h3>
    </header>

    <div class="container">
        <div id="profile-card" class="profile-card">
            <div class="loading-state">Loading user information...</div>
        </div>
    </div>

<script src="back-handler.js"></script>
<script src="idb.js"></script>
<script src="theme.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { 
    apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM", 
    authDomain: "auth.flexieduconsult.com.ng", 
    projectId: "waec2026jamb2027" 
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const profileUid = params.get("uid");
const cardEl = document.getElementById("profile-card");

function escapeHTML(str) {
    if (typeof str !== "string") return "";
    return str.replace(/[&<>'"]/g, function(tag) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[tag] || tag;
    });
}

onAuthStateChanged(auth, async function(currentUser) {
    if (!profileUid) {
        cardEl.innerHTML = '<div class="error-state">No user specified in URL.</div>';
        return;
    }

    try {
        var name = "";
        var email = "";
        var photoURL = null;
        var bio = "No bio provided.";
        var role = "Member";

        var pSnap = await getDoc(doc(db, "profiles", profileUid));
        if (!pSnap.exists()) {
            pSnap = await getDoc(doc(db, "users", profileUid));
        }

        if (pSnap.exists()) {
            var data = pSnap.data();
            name = data.displayName || data.name || data.userName || data.username || data.fullName || data.full_name || "";
            email = data.email || "";
            photoURL = data.photoURL || data.photoUrl || data.avatarUrl || data.image || null;
            bio = data.bio || data.about || bio;
            role = data.role || role;
        }

        if (currentUser && currentUser.uid === profileUid) {
            if (!name) name = currentUser.displayName || (currentUser.email ? currentUser.email.split("@")[0] : "");
            if (!email) email = currentUser.email || "";
            if (!photoURL) photoURL = currentUser.photoURL || null;
        }

        if (!name) {
            name = email ? email.split("@")[0] : "Member";
        }
        if (!email) {
            email = "Hidden or not provided";
        }

        var initial = name.charAt(0).toUpperCase();
        var avatarHTML = "";

        if (photoURL) {
            avatarHTML = '<div class="avatar-large">' +
                '<img src="' + escapeHTML(photoURL) + '" alt="' + escapeHTML(name) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
                '<span class="avatar-fallback" style="display:none;">' + initial + '</span>' +
                '</div>';
        } else {
            avatarHTML = '<div class="avatar-large">' + initial + '</div>';
        }

        cardEl.innerHTML =
            avatarHTML +
            '<div class="user-name">' + escapeHTML(name) + '</div>' +
            '<div class="user-email">' + escapeHTML(email) + '</div>' +
            '<div class="user-status">● ' + escapeHTML(role) + '</div>' +
            '<div class="info-group">' +
            '<div class="info-label">About / Bio</div>' +
            '<div class="info-value">' + escapeHTML(bio) + '</div>' +
            '</div>' +
            '<div class="action-btns">' +
            '<button class="btn btn-secondary" onclick="FlexiBack.goBack(\'chat.html\')">Go Back</button>' +
            '</div>';

    } catch (err) {
        console.error("Profile load error:", err);
        cardEl.innerHTML = '<div class="error-state">Failed to load user profile.</div>';
    }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script>
(function () {
    try {
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    } catch (e) {}
})();
</script>

<link rel="stylesheet" href="theme.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flexi CBT | JAMB Subject Selection</title>

    <style>
        :root {
            --flexi-navy: #003366;
            --flexi-green: #008000;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: none;
            transition: .3s ease;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--header);
            color: var(--text);
            padding: 12px 10px;
            border-bottom: 8px solid var(--flexi-green);
            text-align: center;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            color: var(--flexi-green);
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }

        .welcome-msg h2 {
            color: var(--flexi-navy);
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .welcome-msg p {
            color: var(--subtext);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .mode-section {
            background: var(--card);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        .mode-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--flexi-navy);
            margin-bottom: 8px;
            display: block;
        }

        .subject-list,
        .mode-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .subject-list {
            background: var(--card);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
        }

        .sub-row {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            border-radius: 8px;
            transition: background 0.15s ease;
        }

        .sub-row:hover {
            background: rgba(46, 139, 87, 0.05);
        }

        .sub-row input {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--flexi-green);
        }

        .sub-row span {
            font-size: 0.95rem;
            color: var(--text);
        }

        .sub-row.locked {
            opacity: 0.6;
            cursor: not-allowed;
            background: transparent !important;
        }

        .sub-row.compulsory {
            background: rgba(0, 128, 0, 0.06);
        }

        .sub-row.compulsory input {
            cursor: not-allowed;
        }

        .compulsory-label {
            margin-left: auto;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--flexi-green);
            text-transform: uppercase;
        }

        .selection-info {
            text-align: center;
            margin-top: 12px;
            font-size: 0.78rem;
            color: var(--subtext);
        }

        .selection-count {
            font-weight: bold;
            color: var(--flexi-green);
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .btn-change,
        .btn-proceed {
            border: none;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: var(--card-shadow);
        }

        .btn-change {
            flex: 1;
            background: var(--border);
            color: var(--text);
        }

        .btn-change:hover {
            opacity: 0.8;
        }

        .btn-proceed {
            flex: 2;
            background: var(--flexi-green);
            color: white;
        }

        .btn-proceed:hover {
            opacity: 0.9;
        }

        .btn-proceed:disabled {
            background: var(--border);
            color: var(--subtext);
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<!-- Global Theme Script -->
<script src="idb.js"></script>
<script src="theme.js"></script>
<script src="back-handler.js"></script>

<script>
(function () {

    const subjectForm = document.getElementById("subjectForm");
    const proceedBtn = document.getElementById("proceed-btn");
    const selectionCount = document.getElementById("selection-count");

    const compulsorySubject = "English Language";

    /*
     * JAMB SUBJECTS
     * English Language is compulsory.
     * Candidate must select exactly 3 additional subjects.
     */

    function getStorageValue(key) {
        try {
            if (typeof IDB !== "undefined" && typeof IDB.getItem === "function") {
                return IDB.getItem(key);
            }
        } catch (error) {
            console.warn("IndexedDB read failed:", error);
        }

        return Promise.resolve(localStorage.getItem(key));
    }

    function setStorageValue(key, value) {
        try {
            if (typeof IDB !== "undefined" && typeof IDB.setItem === "function") {
                return IDB.setItem(key, value);
            }
        } catch (error) {
            console.warn("IndexedDB write failed:", error);
        }

        localStorage.setItem(key, value);
        return Promise.resolve();
    }

    /*
     * Check whether the candidate has already been identified locally.
     *
     * We deliberately do NOT require Firebase on this page.
     * The candidate information should already have been saved locally
     * by the login/authentication flow.
     */

    async function initializePage() {

        try {

            const userName = await getStorageValue("userName");
            const userEmail = await getStorageValue("userEmail");
            const userUid = await getStorageValue("userUid");

            /*
             * If no candidate information exists locally, send the
             * candidate back to login.
             */
            if (!userName && !userEmail && !userUid) {
                window.location.href = "login.html";
                return;
            }

            /*
             * Make sure this is the JAMB flow.
             */
            await setStorageValue("selectedExamType", "JAMB");

            /*
             * Keep FLEXI display name if it was selected from test.html.
             * Otherwise default to JAMB.
             */
            const existingDisplayName = await getStorageValue("displayExamName");

            if (!existingDisplayName) {
                await setStorageValue("displayExamName", "JAMB");
            }

            document.body.style.display = "block";

            validateSelection();

        } catch (error) {

            console.error("Page initialization error:", error);

            /*
             * If IndexedDB fails completely, still allow localStorage
             * to determine whether the candidate exists.
             */
            const fallbackName = localStorage.getItem("userName");
            const fallbackEmail = localStorage.getItem("userEmail");
            const fallbackUid = localStorage.getItem("userUid");

            if (!fallbackName && !fallbackEmail && !fallbackUid) {
                window.location.href = "login.html";
                return;
            }

            document.body.style.display = "block";
            validateSelection();
        }
    }

    /*
     * Validate JAMB subject selection.
     *
     * English Language is compulsory.
     * Exactly 3 additional subjects must be selected.
     */
    window.validateSelection = function () {

        const checkboxes = Array.from(
            document.querySelectorAll('input[name="subject"]')
        );

        const additionalSubjects = checkboxes.filter(function (checkbox) {
            return checkbox.value !== compulsorySubject;
        });

        const selectedAdditional = additionalSubjects.filter(function (checkbox) {
            return checkbox.checked;
        });

        const count = selectedAdditional.length;

        selectionCount.textContent = count + " / 3";

        /*
         * Once 3 additional subjects are selected,
         * lock all unselected subjects.
         */
        additionalSubjects.forEach(function (checkbox) {

            if (count >= 3 && !checkbox.checked) {

                checkbox.disabled = true;

                checkbox.parentElement.classList.add("locked");

            } else {

                checkbox.disabled = false;

                checkbox.parentElement.classList.remove("locked");

            }
        });

        /*
         * Proceed only when exactly 3 additional subjects
         * have been selected.
         */
        proceedBtn.disabled = count !== 3;
    };

    /*
     * Save the candidate's four subjects:
     *
     * 1. English Language
     * 2. Additional subject
     * 3. Additional subject
     * 4. Additional subject
     */
    window.saveAndMove = async function () {

        const checkedAdditional = Array.from(
            document.querySelectorAll('input[name="subject"]:checked')
        ).filter(function (checkbox) {
            return checkbox.value !== compulsorySubject;
        });

        if (checkedAdditional.length !== 3) {

            alert("Please select exactly 3 additional subjects.");

            return;
        }

        const subjectKeys = [
            compulsorySubject,
            ...checkedAdditional.map(function (checkbox) {
                return checkbox.value;
            })
        ];

        const selectedModeElement = document.querySelector(
            'input[name="examMode"]:checked'
        );

        const mode = selectedModeElement
            ? selectedModeElement.value
            : "Practice";

        /*
         * Save exactly the keys expected by page3.html
         * and exam.html.
         */
        await setStorageValue(
            "userSubjectKeys",
            JSON.stringify(subjectKeys)
        );

        await setStorageValue(
            "examMode",
            mode
        );

        /*
         * Make sure the selected exam type remains JAMB
         * internally for the question-loading flow.
         */
        await setStorageValue(
            "selectedExamType",
            "JAMB"
        );

        /*
         * Preserve the display name:
         * JAMB or FLEXI depending on what the candidate selected.
         */
        const displayExamName = await getStorageValue("displayExamName");

        if (!displayExamName) {

            await setStorageValue(
                "displayExamName",
                "JAMB"
            );

        }

        /*
         * Continue to the instructions page.
         */
        window.location.href = "page3.html";
    };

    /*
     * Prevent the compulsory English checkbox from
     * being accidentally changed through the UI.
     */
    const englishCheckbox = document.querySelector(
        'input[name="subject"][value="English Language"]'
    );

    if (englishCheckbox) {
        englishCheckbox.checked = true;
        englishCheckbox.disabled = true;
    }

    /*
     * Start page.
     */
    initializePage();

})();
</script>

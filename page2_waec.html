<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="theme.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Flexi CBT | Subject Selection</title>

    <style>
        :root {
            --flexi-navy: #003366;
            --flexi-green: #008000;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: none;
            transition: .3s ease;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--header);
            color: var(--text);
            padding: 12px 10px;
            border-bottom: 8px solid var(--flexi-green);
            text-align: center;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            color: var(--flexi-green);
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }

        .welcome-msg h2 {
            color: var(--flexi-navy);
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .welcome-msg p {
            color: var(--subtext);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .mode-section {
            background: var(--card);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        .mode-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--flexi-navy);
            margin-bottom: 8px;
            display: block;
        }

        .subject-list,
        .mode-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .subject-list {
            background: var(--card);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
        }

        .sub-row {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            border-radius: 8px;
            transition: background 0.15s ease;
        }

        .sub-row:hover {
            background: rgba(46, 139, 87, 0.05);
        }

        .sub-row input {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--flexi-green);
        }

        .sub-row span {
            font-size: 0.95rem;
            color: var(--text);
        }

        .sub-row.locked {
            opacity: 0.6;
            cursor: not-allowed;
            background: transparent !important;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .btn-change,
        .btn-proceed {
            border: none;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: var(--card-shadow);
        }

        .btn-change {
            flex: 1;
            background: var(--border);
            color: var(--text);
        }

        .btn-change:hover {
            opacity: 0.8;
        }

        .btn-proceed {
            flex: 2;
            background: var(--flexi-green);
            color: white;
        }

        .btn-proceed:hover {
            opacity: 0.9;
        }

        .btn-proceed:disabled {
            background: var(--border);
            color: var(--subtext);
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">
        <h1>FLEXI EDUCATIONAL CONSULT</h1>
    </div>
</header>

<div class="container">

        <label class="sub-row"><input type="checkbox" name="subject" value="Agricultural Science" onchange="validateSelection()"><span>Agricultural Science</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Animal Husbandry" onchange="validateSelection()"><span>Animal Husbandry</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Health Education" onchange="validateSelection()"><span>Health Education</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Financial Accounting" onchange="validateSelection()"><span>Financial Accounting</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Commerce" onchange="validateSelection()"><span>Commerce</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Economics" onchange="validateSelection()"><span>Economics</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Marketing" onchange="validateSelection()"><span>Marketing</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Office Practice" onchange="validateSelection()"><span>Office Practice</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Insurance" onchange="validateSelection()"><span>Insurance</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Literature in English" onchange="validateSelection()"><span>Literature in English</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="Government" onchange="validateSelection()"><span>Government</span></label>
        <label class="sub-row"><input type="checkbox" name="subject" value="History" onchange="validateSelection()"><span>History</span></label>

    </form>

    <!-- BUTTONS -->
    <div class="btn-group">
        <button type="button" class="btn-change" onclick="window.location.href='test.html'">

            Proceed to Instructions
        </button>
    </div>

</div>

<!-- Global Theme Script -->
<script src="idb.js"></script>
<script src="theme.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",
    authDomain: "flexieduconsult.com.ng",
    projectId: "waec2026jamb2027"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const currentExamType =
    (typeof IDB !== "undefined" ? (await IDB.getItem("selectedExamType") || await IDB.getItem("displayExamName")) : (localStorage.getItem("selectedExamType") || localStorage.getItem("displayExamName"))) || "WAEC";

onAuthStateChanged(auth, (user) => {

    if (user) {

        document.body.style.display = "block";

        document.getElementById("exam-title").innerText =
            currentExamType + " Selection";

        document.getElementById("exam-subtitle").innerText =
            "Pick your mode and up to 9 subjects";

    } else {

        window.location.href = "login.html";

    }

});

window.validateSelection = () => {

    const checkboxes =
        document.querySelectorAll('input[name="subject"]');

    const checkedBoxes = Array.from(checkboxes).filter(c => c.checked);
    const checkedCount = checkedBoxes.length;

    // WAEC/NECO Selection Rules: Max 9 subjects, at least 1 required
    checkboxes.forEach(c => {
        if (checkedCount >= 9 && !c.checked) {
            c.disabled = true;
            c.parentElement.classList.add("locked");
        } else {
            c.disabled = false;
            c.parentElement.classList.remove("locked");
        }
    });

    document.getElementById("proceed-btn").disabled =
        checkedCount === 0;

};

window.saveAndMove = async () => {

    const checked =
        document.querySelectorAll('input[name="subject"]:checked');

    const subjectKeys =
        Array.from(checked).map(c => c.value);

    const mode =
        document.querySelector('input[name="examMode"]:checked').value;

    if (typeof IDB !== "undefined") {
        await IDB.setItem("userSubjectKeys", JSON.stringify(subjectKeys));
        await IDB.setItem("examMode", mode);
    } else {
        localStorage.setItem("userSubjectKeys", JSON.stringify(subjectKeys));
        localStorage.setItem("examMode", mode);
    }

    window.location.href = "page3.html";

};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Group Chat</title>
    <script>
    (function () {
        try {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="theme.css">

    <!-- Eruda - Mobile Console -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { height: 60px; background: var(--header); color: var(--text); display: flex; align-items: center; padding: 0 15px; gap: 15px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .back-btn { font-size: 1.4rem; cursor: pointer; text-decoration: none; color: inherit; background: none; border: none; }
    #comment-feed { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .msg-row { display: flex; gap: 8px; width: 100%; align-items: flex-start; }
    .msg-row.sent { justify-content: flex-end; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--green, #2E8B57); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; flex-shrink: 0; overflow: hidden; cursor: pointer; position: relative; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .avatar-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; color: #fff; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 0.95rem; }
    .sent .msg-bubble { background: var(--sent-bg, #2E8B57); color: #ffffff; border-bottom-right-radius: 2px; }
    .received .msg-bubble { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .msg-name { font-size: 0.75rem; font-weight: bold; color: var(--green, #2E8B57); margin-bottom: 4px; cursor: pointer; }
    .img-grid { display: grid; gap: 4px; margin-top: 6px; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .img-grid-1 { grid-template-columns: 1fr; }
    .img-grid-2 { grid-template-columns: 1fr 1fr; }
    .img-grid-3 { grid-template-columns: 1fr 1fr; }
    .img-grid-3 .img-item:nth-child(3) { grid-column: span 2; }
    .img-grid-4, .img-grid-more { grid-template-columns: 1fr 1fr; }
    .img-item { position: relative; width: 100%; padding-top: 100%; background: #000; overflow: hidden; }
    .img-grid-1 .img-item { padding-top: 60%; }
    .img-item img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }
    .img-more-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; }
    .bottom-container { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); z-index: 10; }
    .preview-bar { display: none; gap: 8px; padding: 10px 10px 0 10px; overflow-x: auto; white-space: nowrap; }
    .preview-bar.active { display: flex; }
    .preview-thumb { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .remove-thumb { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
    .input-bar { display: flex; gap: 8px; padding: 10px; align-items: center; }
    .input-bar input[type="text"] { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 25px; padding: 10px 15px; outline: none; }
    .btn-post { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--green, #2E8B57); color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .btn-file { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; overflow: hidden; touch-action: none; }
    .lightbox-modal.active { display: flex; }
    .lightbox-img-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    .lightbox-img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; user-select: none; -webkit-user-drag: none; }
    .lightbox-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 32px; font-weight: bold; cursor: pointer; z-index: 1001; }
    .lightbox-counter { position: absolute; top: 25px; left: 25px; color: rgba(255,255,255,0.8); font-size: 1rem; z-index: 1001; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 2.5rem; background: rgba(255,255,255,0.15); border: none; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; }
    .lightbox-nav.prev { left: 15px; }
    .lightbox-nav.next { right: 15px; }
    .loading-msg, .empty-msg, .error-msg { padding: 40px 20px; text-align: center; color: var(--subtext); }
    .error-msg { color: #e53e3e; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="FlexiBack.goBack('chat.html')">❮</button>
        <h3 id="group-title">Group Chat</h3>
    </header>

    <div id="comment-feed">
        <div class="loading-msg">Loading messages...</div>
    </div>

    <div class="bottom-container">
        <div id="preview-bar" class="preview-bar"></div>
        <div class="input-bar">
            <label for="file-upload" class="btn-file">+</label>
            <input id="chat-msg-input" type="text" placeholder="Type your message...">
            <button id="send-btn" type="button" class="btn-post">➤</button>
        </div>
    </div>

    <input type="file" id="file-upload" accept="image/*" multiple style="display:none;">

    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
        <button class="lightbox-nav prev" id="lightbox-prev">&#10094;</button>
        <div class="lightbox-img-wrapper" id="lightbox-wrapper">
            <img id="lightbox-img" src="" alt="Full view">
        </div>
        <button class="lightbox-nav next" id="lightbox-next">&#10095;</button>
    </div>

<script src="back-handler.js"></script>
<script src="idb.js"></script>
<script src="theme.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { 
    apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM", 
    authDomain: "auth.flexieduconsult.com.ng", 
    projectId: "waec2026jamb2027" 
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const groupId = params.get("id");
const groupName = params.get("name") || "Group Discussion";

const MAX_FILE_SIZE_MB = 10;
const CLOUDINARY_CLOUD_NAME = "dwmbgd9jy";
const CLOUDINARY_PRESET = "my_preset_123";

let isPosting = false;
let selectedFiles = [];
const profileCache = new Map();
let currentAuthUser = null;
let currentGalleryImages = [];
let currentGalleryIndex = 0;
let unsubscribeListener = null;

const groupTitleEl = document.getElementById("group-title");
const fileInput = document.getElementById("file-upload");
const sendBtn = document.getElementById("send-btn");
const chatInput = document.getElementById("chat-msg-input");
const feed = document.getElementById("comment-feed");
const previewBar = document.getElementById("preview-bar");

const lightbox = document.getElementById("lightbox");
const lightboxWrapper = document.getElementById("lightbox-wrapper");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxCounter = document.getElementById("lightbox-counter");
const lightboxClose = document.getElementById("lightbox-close");
const lightboxPrev = document.getElementById("lightbox-prev");
const lightboxNext = document.getElementById("lightbox-next");

if (groupTitleEl) groupTitleEl.textContent = groupName;

function escapeHTML(str) {
    if (typeof str !== "string") return "";
    return str.replace(/[&<>'"]/g, function(tag) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[tag] || tag;
    });
}

function getUsername() {
    if (!currentAuthUser) return "Student";
    return currentAuthUser.displayName || (currentAuthUser.email ? currentAuthUser.email.split("@")[0] : "Student");
}

async function getUserProfile(uid) {
    if (!uid) return null;
    if (profileCache.has(uid)) return profileCache.get(uid);
    try {
        var pSnap = await getDoc(doc(db, "profiles", uid));
        if (!pSnap.exists()) {
            pSnap = await getDoc(doc(db, "users", uid));
        }
        if (pSnap.exists()) {
            var data = pSnap.data();
            profileCache.set(uid, data);
            return data;
        }
    } catch (e) {
        console.error("Profile fetch error:", e);
    }
    return null;
}

function renderImageGrid(images, serializedImages) {
    if (!images || !images.length) return "";
    var safeImages = images.map(function(img) { return escapeHTML(img); });
    var c = safeImages.length;
    var gridHTML = "";

    if (c === 1) {
        gridHTML = '<div class="img-grid img-grid-1" data-images="' + serializedImages + '"><div class="img-item" data-index="0"><img src="' + safeImages[0] + '"></div></div>';
    } else if (c === 2) {
        gridHTML = '<div class="img-grid img-grid-2" data-images="' + serializedImages + '"><div class="img-item" data-index="0"><img src="' + safeImages[0] + '"></div><div class="img-item" data-index="1"><img src="' + safeImages[1] + '"></div></div>';
    } else if (c === 3) {
        gridHTML = '<div class="img-grid img-grid-3" data-images="' + serializedImages + '"><div class="img-item" data-index="0"><img src="' + safeImages[0] + '"></div><div class="img-item" data-index="1"><img src="' + safeImages[1] + '"></div><div class="img-item" data-index="2"><img src="' + safeImages[2] + '"></div></div>';
    } else if (c === 4) {
        gridHTML = '<div class="img-grid img-grid-4" data-images="' + serializedImages + '">';
        for (var i = 0; i < 4; i++) {
            gridHTML += '<div class="img-item" data-index="' + i + '"><img src="' + safeImages[i] + '"></div>';
        }
        gridHTML += "</div>";
    } else {
        gridHTML = '<div class="img-grid img-grid-more" data-images="' + serializedImages + '">' +
            '<div class="img-item" data-index="0"><img src="' + safeImages[0] + '"></div>' +
            '<div class="img-item" data-index="1"><img src="' + safeImages[1] + '"></div>' +
            '<div class="img-item" data-index="2"><img src="' + safeImages[2] + '"></div>' +
            '<div class="img-item" data-index="3"><img src="' + safeImages[3] + '"><div class="img-more-overlay">+' + (c - 4) + "</div></div></div>";
    }
    return gridHTML;
}

function initMessageListener() {
    if (unsubscribeListener) return;
    if (!groupId) {
        feed.innerHTML = '<div class="error-msg">Missing group ID. Please go back and try again.</div>';
        return;
    }

    console.log("Listening to group:", groupId);

    var q = query(collection(db, "groups", groupId, "messages"), orderBy("timestamp", "asc"));

    unsubscribeListener = onSnapshot(q, async function(snapshot) {
        if (!feed) return;

        try {
            var uidsToFetch = new Set();
            snapshot.docs.forEach(function(docSnap) {
                var msg = docSnap.data();
                if (msg.senderUid) uidsToFetch.add(msg.senderUid);
            });
            await Promise.all(Array.from(uidsToFetch).map(function(uid) {
                return getUserProfile(uid);
            }));

            if (snapshot.empty) {
                feed.innerHTML = '<div class="empty-msg">No messages yet. Start the conversation!</div>';
                return;
            }

            var completeFeedHTML = "";

            snapshot.docs.forEach(function(docSnap) {
                var msg = docSnap.data();
                var isSent = currentAuthUser && msg.senderUid === currentAuthUser.uid;
                var images = msg.imageUrls || (msg.imageUrl ? [msg.imageUrl] : []);

                var avatarHTML = "";
                if (!isSent) {
                    var profile = profileCache.get(msg.senderUid);
                    var initial = msg.sender ? msg.sender.charAt(0).toUpperCase() : "U";
                    var photo = null;
                    if (profile) {
                        photo = profile.photoURL || profile.photoUrl || profile.avatarUrl || profile.profileImage || profile.image || null;
                    }

                    if (photo) {
                        avatarHTML = '<div class="avatar profile-link" data-uid="' + escapeHTML(msg.senderUid) + '">' +
                            '<img src="' + escapeHTML(photo) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
                            '<span class="avatar-fallback" style="display:none;">' + initial + '</span>' +
                            '</div>';
                    } else {
                        avatarHTML = '<div class="avatar profile-link" data-uid="' + escapeHTML(msg.senderUid) + '">' + initial + '</div>';
                    }
                }

                var serializedImages = encodeURIComponent(JSON.stringify(images));

                completeFeedHTML +=
                    '<div class="msg-row ' + (isSent ? "sent" : "received") + '">' +
                    avatarHTML +
                    '<div class="msg-bubble">' +
                    (!isSent ? '<div class="msg-name profile-link" data-uid="' + escapeHTML(msg.senderUid) + '">' + escapeHTML(msg.sender || "Anonymous") + "</div>" : "") +
                    (msg.text ? '<div class="msg-text">' + escapeHTML(msg.text) + "</div>" : "") +
                    renderImageGrid(images, serializedImages) +
                    "</div></div>";
            });

            feed.innerHTML = completeFeedHTML;
            attachImageClickEvents();
            attachProfileClickEvents();
            window.scrollTo(0, document.body.scrollHeight);
        } catch (err) {
            console.error("Snapshot render error:", err);
            feed.innerHTML = '<div class="error-msg">Error loading messages.<br>' + err.message + "</div>";
        }
    }, function(error) {
        console.error("Listener error:", error);
        feed.innerHTML = '<div class="error-msg">Failed to load messages.<br>' + error.message + "</div>";
    });
}

function attachProfileClickEvents() {
    document.querySelectorAll(".profile-link").forEach(function(el) {
        el.addEventListener("click", function() {
            var uid = el.getAttribute("data-uid");
            if (uid) {
                window.location.href = "chat_info.html?uid=" + encodeURIComponent(uid);
            }
        });
    });
}

function attachImageClickEvents() {
    document.querySelectorAll(".img-grid").forEach(function(grid) {
        grid.addEventListener("click", function(e) {
            var item = e.target.closest(".img-item");
            if (!item) return;
            var rawImages = grid.getAttribute("data-images");
            if (!rawImages) return;
            try {
                currentGalleryImages = JSON.parse(decodeURIComponent(rawImages));
                currentGalleryIndex = parseInt(item.getAttribute("data-index") || "0", 10);
                openLightbox();
            } catch (err) {
                console.error("Failed to parse gallery images:", err);
            }
        });
    });
}

function openLightbox() {
    if (!currentGalleryImages.length) return;
    resetZoom();
    updateLightboxView();
    lightbox.classList.add("active");
}

function closeLightbox() {
    lightbox.classList.remove("active");
    lightboxImg.src = "";
    resetZoom();
}

function updateLightboxView() {
    resetZoom();
    lightboxImg.src = currentGalleryImages[currentGalleryIndex];
    lightboxCounter.textContent = (currentGalleryIndex + 1) + " / " + currentGalleryImages.length;
    if (currentGalleryImages.length <= 1) {
        lightboxPrev.style.display = "none";
        lightboxNext.style.display = "none";
    } else {
        lightboxPrev.style.display = "flex";
        lightboxNext.style.display = "flex";
    }
}

var scale = 1, currentX = 0, currentY = 0;

function resetZoom() {
    scale = 1;
    currentX = 0;
    currentY = 0;
    applyTransform();
}

function applyTransform() {
    lightboxImg.style.transform = "translate(" + currentX + "px, " + currentY + "px) scale(" + scale + ")";
}

lightboxClose.addEventListener("click", closeLightbox);
lightboxPrev.addEventListener("click", function(e) {
    e.stopPropagation();
    currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
    updateLightboxView();
});
lightboxNext.addEventListener("click", function(e) {
    e.stopPropagation();
    currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length;
    updateLightboxView();
});

if (fileInput) {
    fileInput.addEventListener("click", function(e) { e.target.value = null; });
    fileInput.addEventListener("change", function(e) {
        var files = Array.from(e.target.files || []);
        var validFiles = files.filter(function(f) {
            return f.type.startsWith("image/") && f.size <= MAX_FILE_SIZE_MB * 1024 * 1024;
        });
        selectedFiles = selectedFiles.concat(validFiles);
        renderPreviews();
    });
}

function renderPreviews() {
    if (selectedFiles.length === 0) {
        previewBar.classList.remove("active");
        previewBar.innerHTML = "";
        return;
    }
    previewBar.classList.add("active");
    previewBar.innerHTML = "";
    selectedFiles.forEach(function(file, index) {
        var thumb = document.createElement("div");
        thumb.className = "preview-thumb";
        var img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        var removeBtn = document.createElement("button");
        removeBtn.className = "remove-thumb";
        removeBtn.textContent = "✕";
        removeBtn.onclick = function() {
            selectedFiles.splice(index, 1);
            renderPreviews();
        };
        thumb.appendChild(img);
        thumb.appendChild(removeBtn);
        previewBar.appendChild(thumb);
    });
}

async function sendChatMessage() {
    if (isPosting) return;
    try {
        if (!groupId || !currentAuthUser) return;
        var message = chatInput ? chatInput.value.trim() : "";
        if (!message && selectedFiles.length === 0) return;

        isPosting = true;
        if (sendBtn) {
            sendBtn.disabled = true;
            sendBtn.textContent = "...";
        }

        var imageUrls = [];
        if (selectedFiles.length > 0) {
            for (var i = 0; i < selectedFiles.length; i++) {
                var formData = new FormData();
                formData.append("file", selectedFiles[i]);
                formData.append("upload_preset", CLOUDINARY_PRESET);
                var res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
                    method: "POST",
                    body: formData
                });
                var data = await res.json();
                if (res.ok && data.secure_url) {
                    imageUrls.push(data.secure_url);
                }
            }
        }

        await addDoc(collection(db, "groups", groupId, "messages"), {
            sender: getUsername(),
            senderUid: currentAuthUser.uid,
            text: message,
            imageUrls: imageUrls,
            timestamp: serverTimestamp()
        });

        if (chatInput) chatInput.value = "";
        selectedFiles = [];
        renderPreviews();
    } catch (e) {
        console.error("Message send error:", e);
        alert("Failed to send message. Please try again.");
    } finally {
        isPosting = false;
        if (sendBtn) {
            sendBtn.disabled = false;
            sendBtn.textContent = "➤";
        }
    }
}

if (sendBtn) {
    sendBtn.addEventListener("click", function(e) {
        e.preventDefault();
        sendChatMessage();
    });
}
if (chatInput) {
    chatInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
        }
    });
}

onAuthStateChanged(auth, function(user) {
    currentAuthUser = user;
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    if (groupId) {
        initMessageListener();
    } else {
        feed.innerHTML = '<div class="error-msg">Missing group ID. Please go back and try again.</div>';
        console.error("Missing group ID in URL");
    }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exam Results | Flexi CBT</title>

    <link rel="stylesheet" href="theme.css">

    <style>
        :root {
            --flexi-green: #008000;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* HEADER */
        header {
            background: var(--header);
            color: var(--text);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid var(--flexi-green);
            box-shadow: var(--card-shadow);
        }

        .header-container {
            display: flex;
            align-items: center;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .h-left {
            font-weight: bold;
            font-size: 0.85rem;
            line-height: 1.2;
            color: var(--text);
        }

        .h-left span {
            color: var(--flexi-green);
        }

        /* MAIN */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        /* SYNC STATUS */
        .sync-banner {
            padding: 10px 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .sync-banner.offline {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .sync-banner.synced {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* RESULT CARD */
        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid var(--flexi-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px auto 20px;
            font-weight: bold;
            color: var(--text);
            background: var(--bg);
        }

        .score-circle span {
            font-size: 2rem;
            color: var(--text);
        }

        .score-circle small {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--subtext);
        }

        /* SCORE TABLE */
        .score-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        .score-table th {
            text-align: left;
            color: var(--subtext);
            font-weight: 600;
            padding: 10px 8px;
            border-bottom: 2px solid var(--border);
        }

        .score-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            color: var(--text);
        }

        .score-table b {
            color: var(--flexi-green);
        }

        /* BUTTONS */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-primary,
        .btn-outline {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }

        .btn-primary {
            background: var(--flexi-green);
            color: white;
        }

        .btn-outline {
            background: #666;
            color: white;
        }

        .btn-primary:active,
        .btn-outline:active {
            transform: translateY(2px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .btn-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">
        <div class="h-left">
            Flexi CBT<br>
            <span id="user-display">Candidate</span>
        </div>
    </div>
</header>

<div class="container">

    <!-- SYNC STATUS -->
    <div id="sync-banner" class="sync-banner offline">
        <span id="sync-status-text">
            Checking score sync status...
        </span>
    </div>

    <!-- RESULT CARD -->
    <div class="result-card">

        <h2 id="exam-title"
            style="margin:0 0 5px; font-size:1.2rem; color:var(--text);">
            Performance Report
        </h2>

        <p style="margin:0 0 20px; font-size:0.85rem; color:var(--subtext);">
            Candidate Performance Breakdown
        </p>

        <div class="score-circle">
            <span id="final-percent">0%</span>
            <small>Score</small>
        </div>

        <table class="score-table">

            <thead>
                <tr>
                    <th>Subject</th>
                    <th style="text-align:right;">Score</th>
                </tr>
            </thead>

            <tbody id="table-body"></tbody>

        </table>

        <div class="btn-grid">

            <button
                class="btn-primary"
                onclick="location.href='corrections.html'">
                VIEW CORRECTIONS
            </button>

            <button
                class="btn-outline"
                onclick="location.href='test.html'">
                NEW EXAM
            </button>

        </div>

    </div>

</div>

<!-- GLOBAL SCRIPTS -->
<script src="idb.js"></script>
<script src="theme.js"></script>
<script src="back-handler.js"></script>

<script type="module">

    /*
     * ============================================================
     * FIREBASE
     * ============================================================
     *
     * Firebase is used when the device is online.
     *
     * IMPORTANT:
     * Firebase is NOT required for viewing a saved result.
     *
     * The candidate can view the result completely offline.
     *
     * If Firebase is available and the candidate is authenticated,
     * the result can also be synchronized to Firestore.
     */

    let firebaseLoaded = false;
    let auth = null;
    let db = null;
    let firebaseAddDoc = null;
    let firebaseCollection = null;

    const firebaseConfig = {
        apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",
        authDomain: "waec2026jamb2027.firebaseapp.com",
        projectId: "waec2026jamb2027"
    };


    /*
     * ============================================================
     * LOCAL STORAGE HELPERS
     * ============================================================
     */

    async function getLocalItem(key) {

        try {

            if (
                typeof IDB !== "undefined" &&
                typeof IDB.getItem === "function"
            ) {

                const value = await IDB.getItem(key);

                if (
                    value !== null &&
                    value !== undefined &&
                    value !== ""
                ) {
                    return value;
                }
            }

        } catch (error) {

            console.warn(
                "IndexedDB read failed:",
                key,
                error
            );

        }

        return localStorage.getItem(key);
    }


    async function setLocalItem(key, value) {

        try {

            if (
                typeof IDB !== "undefined" &&
                typeof IDB.setItem === "function"
            ) {

                await IDB.setItem(key, value);

                return;
            }

        } catch (error) {

            console.warn(
                "IndexedDB write failed:",
                key,
                error
            );

        }

        localStorage.setItem(key, value);
    }


    async function removeLocalItem(key) {

        try {

            if (
                typeof IDB !== "undefined" &&
                typeof IDB.removeItem === "function"
            ) {

                await IDB.removeItem(key);

                return;
            }

        } catch (error) {

            console.warn(
                "IndexedDB remove failed:",
                key,
                error
            );

        }

        localStorage.removeItem(key);
    }


    /*
     * ============================================================
     * LOAD RESULT
     * ============================================================
     *
     * Priority:
     *
     * 1. sessionStorage.examResult
     * 2. IndexedDB.latestExamResult
     * 3. localStorage.latestExamResult
     *
     */

    async function loadResult() {

        let rawData =
            sessionStorage.getItem("examResult");

        if (!rawData) {

            rawData =
                await getLocalItem(
                    "latestExamResult"
                );

        }


        /*
         * No result available.
         */

        if (!rawData) {

            document.getElementById(
                "exam-title"
            ).innerText = "No Result Found";

            document.getElementById(
                "table-body"
            ).innerHTML = `
                <tr>
                    <td colspan="2"
                        style="text-align:center;">
                        No saved examination result was found
                        on this device.
                    </td>
                </tr>
            `;

            document.getElementById(
                "final-percent"
            ).innerText = "0%";

            document.body.style.display = "flex";

            return null;
        }


        /*
         * Parse result.
         */

        let result;

        try {

            result =
                typeof rawData === "string"
                    ? JSON.parse(rawData)
                    : rawData;

        } catch (error) {

            console.error(
                "Result parsing failed:",
                error
            );

            document.getElementById(
                "exam-title"
            ).innerText = "Result Error";

            document.body.style.display = "flex";

            return null;
        }


        /*
         * Candidate name.
         */

        const candidateName =
            result.name ||
            result.userName ||
            await getLocalItem("userName") ||
            "Candidate";


        document.getElementById(
            "user-display"
        ).innerText = candidateName;


        /*
         * Exam title.
         */

        const examName =
            result.exam ||
            result.examName ||
            result.displayExamName ||
            await getLocalItem("displayExamName") ||
            "CBT";


        document.getElementById(
            "exam-title"
        ).innerText =
            `${examName} Results`;


        /*
         * Percentage.
         */

        let percentage =
            result.percentage;

        if (
            percentage === undefined ||
            percentage === null ||
            percentage === ""
        ) {

            if (
                result.score !== undefined &&
                result.total
            ) {

                percentage =
                    (
                        Number(result.score) /
                        Number(result.total)
                    ) * 100;

            } else {

                percentage = 0;

            }
        }


        percentage =
            Number(percentage);


        if (!Number.isFinite(percentage)) {
            percentage = 0;
        }


        /*
         * Display percentage.
         */

        document.getElementById(
            "final-percent"
        ).innerText =
            `${percentage}%`;


        /*
         * SUBJECT SCORES
         */

        const tableBody =
            document.getElementById(
                "table-body"
            );


        let rows = "";


        if (
            result.subjectScores &&
            typeof result.subjectScores === "object"
        ) {

            Object.entries(
                result.subjectScores
            ).forEach(
                ([subject, data]) => {

                    /*
                     * Support both:
                     *
                     * {
                     *   score: 20,
                     *   total: 25
                     * }
                     *
                     * and simple numeric scores.
                     */

                    if (
                        typeof data === "object" &&
                        data !== null
                    ) {

                        rows += `
                            <tr>
                                <td>${escapeHTML(subject)}</td>

                                <td style="text-align:right;">
                                    <b>
                                        ${escapeHTML(
                                            data.score ?? 0
                                        )}
                                    </b>
                                    /
                                    ${escapeHTML(
                                        data.total ?? 0
                                    )}
                                </td>
                            </tr>
                        `;

                    } else {

                        rows += `
                            <tr>
                                <td>${escapeHTML(subject)}</td>

                                <td style="text-align:right;">
                                    <b>
                                        ${escapeHTML(data)}
                                    </b>
                                </td>
                            </tr>
                        `;

                    }

                }
            );

        }


        /*
         * If subjectScores isn't available,
         * show the general result.
         */

        if (!rows) {

            const score =
                result.score ??
                result.correctAnswers ??
                0;

            const total =
                result.total ??
                result.totalQuestions ??
                0;

            rows = `
                <tr>
                    <td>Overall</td>

                    <td style="text-align:right;">
                        <b>${escapeHTML(score)}</b>
                        /
                        ${escapeHTML(total)}
                    </td>
                </tr>
            `;

        }


        tableBody.innerHTML = rows;


        /*
         * IMPORTANT:
         *
         * Keep the latest result locally even if the
         * candidate is offline.
         */

        await setLocalItem(
            "latestExamResult",
            JSON.stringify(result)
        );


        /*
         * Display page.
         */

        document.body.style.display = "flex";


        return result;
    }


    /*
     * ============================================================
     * HTML ESCAPE
     * ============================================================
     */

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value === undefined ||
            value === null
                ? ""
                : String(value);

        return div.innerHTML;
    }


    /*
     * ============================================================
     * FIREBASE INITIALIZATION
     * ============================================================
     *
     * Firebase is loaded only as an optional online service.
     *
     * If it fails because the device is offline,
     * the result page continues normally.
     */

    async function initializeFirebase() {

        if (!navigator.onLine) {

            console.log(
                "Offline: Firebase synchronization skipped."
            );

            return false;
        }


        try {

            const firebaseApp =
                await import(
                    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
                );

            const firebaseAuth =
                await import(
                    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
                );

            const firebaseFirestore =
                await import(
                    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
                );


            const app =
                firebaseApp.initializeApp(
                    firebaseConfig
                );


            auth =
                firebaseAuth.getAuth(app);


            db =
                firebaseFirestore.getFirestore(
                    app
                );


            firebaseAddDoc =
                firebaseFirestore.addDoc;


            firebaseCollection =
                firebaseFirestore.collection;


            firebaseLoaded = true;


            /*
             * Check Firebase authentication.
             */

            firebaseAuth.onAuthStateChanged(
                auth,
                async (user) => {

                    /*
                     * Firebase user available.
                     */

                    if (user) {

                        const result =
                            await getSavedResult();

                        if (result) {

                            const candidateName =
                                user.displayName ||
                                result.name ||
                                result.userName ||
                                await getLocalItem(
                                    "userName"
                                ) ||
                                "Candidate";


                            /*
                             * Save candidate information
                             * locally for future offline use.
                             */

                            await setLocalItem(
                                "userName",
                                candidateName
                            );


                            await setLocalItem(
                                "userEmail",
                                user.email || ""
                            );


                            await setLocalItem(
                                "userUid",
                                user.uid || ""
                            );


                            /*
                             * Add Firebase identity to result.
                             */

                            result.uid =
                                user.uid;

                            result.name =
                                candidateName;


                            /*
                             * Try to sync result.
                             */

                            await handleFirebaseSync(
                                result
                            );

                        } else {

                            await checkPendingSync();

                        }

                    } else {

                        /*
                         * NO Firebase user.
                         *
                         * IMPORTANT:
                         * DO NOT redirect to login here.
                         *
                         * The result page is allowed to work
                         * completely offline.
                         */

                        const localCandidate =
                            await getLocalCandidate();


                        if (
                            localCandidate.userName ||
                            localCandidate.userEmail ||
                            localCandidate.userUid
                        ) {

                            updateSyncBanner(
                                "offline",
                                "Result saved on this device. Sign in later to sync your score."
                            );

                        } else {

                            updateSyncBanner(
                                "offline",
                                "Result saved on this device."
                            );

                        }

                    }

                }
            );


            return true;

        } catch (error) {

            console.warn(
                "Firebase unavailable. Continuing offline:",
                error
            );

            updateSyncBanner(
                "offline",
                "Offline mode: result is saved on this device."
            );

            return false;
        }

    }


    /*
     * ============================================================
     * GET LOCAL CANDIDATE
     * ============================================================
     */

    async function getLocalCandidate() {

        return {

            userName:
                await getLocalItem(
                    "userName"
                ) || "",

            userEmail:
                await getLocalItem(
                    "userEmail"
                ) || "",

            userUid:
                await getLocalItem(
                    "userUid"
                ) || ""

        };

    }


    /*
     * ============================================================
     * GET SAVED RESULT
     * ============================================================
     */

    async function getSavedResult() {

        let rawData =
            sessionStorage.getItem(
                "examResult"
            );


        if (!rawData) {

            rawData =
                await getLocalItem(
                    "latestExamResult"
                );

        }


        if (!rawData) {
            return null;
        }


        try {

            return typeof rawData === "string"
                ? JSON.parse(rawData)
                : rawData;

        } catch (error) {

            console.error(
                "Could not parse saved result:",
                error
            );

            return null;
        }

    }


    /*
     * ============================================================
     * FIREBASE RESULT SYNC
     * ============================================================
     */

    async function handleFirebaseSync(result) {

        if (!navigator.onLine) {

            await stashForLaterSync(
                result
            );

            return;
        }


        const success =
            await writeToFirebase(
                result
            );


        if (success) {

            await removeLocalItem(
                "pendingLeaderboardSync"
            );


            /*
             * Keep latestExamResult.
             *
             * It is needed by corrections.html.
             */


            sessionStorage.removeItem(
                "examResult"
            );


            updateSyncBanner(
                "synced",
                "Score successfully recorded online."
            );

        } else {

            await stashForLaterSync(
                result
            );

        }

    }


    /*
     * ============================================================
     * SAVE RESULT FOR LATER
     * ============================================================
     */

    async function stashForLaterSync(
        result
    ) {

        await setLocalItem(
            "pendingLeaderboardSync",
            JSON.stringify(result)
        );


        updateSyncBanner(
            "offline",
            "Saved offline. Score will automatically sync when connected."
        );

    }


    /*
     * ============================================================
     * CHECK PENDING SYNCHRONIZATION
     * ============================================================
     */

    async function checkPendingSync() {

        if (!navigator.onLine) {

            updateSyncBanner(
                "offline",
                "Offline mode: result is saved on this device."
            );

            return;
        }


        if (
            !firebaseLoaded ||
            !db
        ) {

            return;
        }


        const pending =
            await getLocalItem(
                "pendingLeaderboardSync"
            );


        if (!pending) {

            updateSyncBanner(
                "synced",
                "Result is saved on this device."
            );

            return;
        }


        let result;

        try {

            result =
                JSON.parse(pending);

        } catch (error) {

            console.error(
                "Invalid pending result:",
                error
            );

            return;
        }


        const success =
            await writeToFirebase(
                result
            );


        if (success) {

            await removeLocalItem(
                "pendingLeaderboardSync"
            );


            sessionStorage.removeItem(
                "examResult"
            );


            updateSyncBanner(
                "synced",
                "Offline score recorded successfully."
            );

        }

    }


    /*
     * ============================================================
     * WRITE TO FIRESTORE
     * ============================================================
     */

    async function writeToFirebase(
        result
    ) {

        if (
            !firebaseLoaded ||
            !db ||
            !firebaseAddDoc ||
            !firebaseCollection
        ) {

            return false;
        }


        try {

            await firebaseAddDoc(
                firebaseCollection(
                    db,
                    "leaderboard"
                ),
                {

                    uid:
                        result.uid ||
                        await getLocalItem(
                            "userUid"
                        ) ||
                        "anonymous",

                    name:
                        result.name ||
                        result.userName ||
                        await getLocalItem(
                            "userName"
                        ) ||
                        "Candidate",

                    exam:
                        result.exam ||
                        result.examName ||
                        await getLocalItem(
                            "displayExamName"
                        ) ||
                        "JAMB/WAEC",

                    percentage:
                        result.percentage || 0,

                    score:
                        result.percentage || 0,

                    rawScore:
                        result.score || 0,

                    totalQuestions:
                        result.total ||
                        result.totalQuestions ||
                        0,

                    speedSec:
                        result.speedSec ||
                        0,

                    subjectScores:
                        result.subjectScores ||
                        {},

                    timestamp:
                        result.timestamp ||
                        Date.now()

                }
            );


            return true;

        } catch (error) {

            console.error(
                "Firestore write failed:",
                error
            );

            return false;
        }

    }


    /*
     * ============================================================
     * UPDATE SYNC BANNER
     * ============================================================
     */

    function updateSyncBanner(
        status,
        message
    ) {

        const banner =
            document.getElementById(
                "sync-banner"
            );


        const statusText =
            document.getElementById(
                "sync-status-text"
            );


        banner.style.display =
            "flex";


        banner.className =
            `sync-banner ${status}`;


        statusText.innerText =
            message;

    }


    /*
     * ============================================================
     * INTERNET CONNECTION
     * ============================================================
     */

    window.addEventListener(
        "online",
        async () => {

            updateSyncBanner(
                "synced",
                "Internet connection restored. Syncing..."
            );


            /*
             * Give Firebase a moment to reconnect.
             */

            setTimeout(
                async () => {

                    if (!firebaseLoaded) {

                        await initializeFirebase();

                    }

                    await checkPendingSync();

                },
                1000
            );

        }
    );


    window.addEventListener(
        "offline",
        () => {

            updateSyncBanner(
                "offline",
                "You are offline. Your result remains saved on this device."
            );

        }
    );


    /*
     * ============================================================
     * START
     * ============================================================
     */

    async function initializePage() {

        /*
         * First load the result.
         *
         * This MUST happen before Firebase.
         *
         * Therefore Firebase can never prevent the candidate
         * from viewing an already-saved result.
         */

        const result =
            await loadResult();


        /*
         * No need to block the result page if Firebase
         * is unavailable.
         */

        if (navigator.onLine) {

            await initializeFirebase();

        } else {

            updateSyncBanner(
                "offline",
                "Offline mode: result is saved on this device."
            );

        }


        /*
         * Check pending result after Firebase initialization.
         */

        if (
            navigator.onLine &&
            firebaseLoaded
        ) {

            await checkPendingSync();

        }

    }


    initializePage();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Who Wants to be a Millionaire – Flexi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#0a1a4a 0%,#0d2b6b 40%,#1a0a4a 100%);
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(80,140,255,.2) 0%,transparent 55%),
    radial-gradient(circle at 15% 90%,rgba(100,60,200,.12) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(40,100,220,.1) 0%,transparent 40%);
  pointer-events:none;z-index:0;
}

.game-wrap{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  min-height:100vh;
  display:flex;flex-direction:column;
  padding:10px 12px 16px;
}

/* ===== TOP BAR ===== */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.walk-btn{
  background:linear-gradient(180deg,#1a4a8a,#0d2a5a);
  border:2px solid #3a7adf;
  border-radius:12px;
  padding:6px 10px 6px 8px;
  display:flex;align-items:center;gap:6px;
  color:#fff;font-size:.7rem;font-weight:700;
  cursor:pointer;text-decoration:none;
}
.walk-btn svg{width:22px;height:22px;fill:#fff}
.walk-btn .m-badge{
  background:#ffd700;color:#1a1a00;
  font-size:.65rem;font-weight:900;
  padding:2px 6px;border-radius:8px;
}
.q-circle-wrap{
  position:relative;width:72px;height:72px;
}
.q-circle{
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#1a3a7a,#0a1540);
  border:3px solid transparent;
  background-clip:padding-box;
  box-shadow:0 0 0 3px #ffd700,0 0 20px rgba(255,215,0,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:900;color:#fff;
  position:relative;z-index:2;
}
.q-circle-ring{
  position:absolute;inset:-6px;border-radius:50%;
  border:2px dashed rgba(255,215,0,.5);
  animation:spin 12s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.gems{
  display:flex;align-items:center;gap:4px;
  background:rgba(0,30,80,.6);
  border:1px solid rgba(100,160,255,.35);
  border-radius:20px;padding:5px 10px;
  font-size:.85rem;font-weight:700;color:#7ec8ff;
}
.gems span{color:#4fc3f7}

/* ===== PRIZE BANNER ===== */
.prize-banner{
  background:linear-gradient(90deg,#e6b800,#ffd700,#f5c400);
  border-radius:8px;
  padding:10px 16px;
  text-align:center;
  margin:10px 0 14px;
  box-shadow:0 4px 15px rgba(255,200,0,.35);
  position:relative;
  clip-path:polygon(4% 0%,96% 0%,100% 50%,96% 100%,4% 100%,0% 50%);
}
.prize-banner .main-prize{
  font-size:1.5rem;font-weight:900;color:#1a1200;
  letter-spacing:.5px;
}
.prize-banner .sub-prize{
  font-size:.75rem;font-weight:700;color:#5a4500;
}

/* ===== QUESTION AREA ===== */
.q-area{
  background:linear-gradient(180deg,rgba(10,30,80,.85),rgba(8,20,55,.9));
  border:1px solid rgba(80,140,255,.3);
  border-radius:14px;
  padding:14px 14px 16px;
  margin-bottom:14px;
  display:flex;gap:12px;align-items:flex-start;
}
.cat-icon{
  width:42px;height:42px;flex-shrink:0;
  background:linear-gradient(135deg,#2e7d32,#1b5e20);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  border:2px solid #66bb6a;
}
.q-text{
  font-size:1rem;font-weight:600;line-height:1.45;
  color:#e8f0ff;flex:1;
}

/* ===== ANSWER BUTTONS ===== */
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.opt{
  display:flex;align-items:center;
  background:linear-gradient(180deg,#0d2a5c,#0a1e48);
  border:2px solid #2a5a9e;
  border-radius:50px;
  padding:13px 16px 13px 14px;
  cursor:pointer;transition:.15s;
  font-size:.95rem;font-weight:600;color:#d8e8ff;
  position:relative;
  clip-path:polygon(3% 0%,97% 0%,100% 50%,97% 100%,3% 100%,0% 50%);
}
.opt:active{transform:scale(.98)}
.opt .letter{
  color:#ff9800;font-weight:900;margin-right:8px;
  font-size:1rem;min-width:22px;
}
.opt.correct{
  background:linear-gradient(180deg,#1b5e20,#0d3b12);
  border-color:#4caf50;
  box-shadow:0 0 18px rgba(76,175,80,.4);
}
.opt.wrong{
  background:linear-gradient(180deg,#b71c1c,#7f0000);
  border-color:#ef5350;
  box-shadow:0 0 18px rgba(239,83,80,.35);
}
.opt.dim{opacity:.3;pointer-events:none}

/* ===== LIFELINES ===== */
.lifelines{
  display:flex;justify-content:center;gap:14px;
  margin-bottom:12px;
}
.life-btn{
  width:58px;height:58px;border-radius:50%;
  border:3px solid #3a7adf;
  background:radial-gradient(circle at 35% 30%,#1a4a9a,#0a2048);
  color:#fff;font-size:.6rem;font-weight:800;
  cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;transition:.15s;
  box-shadow:0 0 12px rgba(50,120,220,.3);
}
.life-btn:active{transform:scale(.92)}
.life-btn .icon{font-size:1.25rem;line-height:1}
.life-btn .badge{
  position:absolute;top:-4px;right:-4px;
  background:#ff5722;color:#fff;
  font-size:.65rem;font-weight:900;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #0a1a4a;
}
.life-btn.used{
  opacity:.3;pointer-events:none;filter:grayscale(1);
  border-color:#555;box-shadow:none;
}

/* ===== BOTTOM BANNER ===== */
.bottom-banner{
  margin-top:auto;
  text-align:center;
  padding:10px 0 4px;
  font-size:1.35rem;font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(90deg,#ff9800,#ffd700,#ff9800);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-transform:uppercase;
}

/* ===== OVERLAYS ===== */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,8,30,.94);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(8px);
}
.overlay.show{display:flex}
.result-box{
  background:linear-gradient(180deg,#0d1b4c,#060d24);
  border:2px solid #ffd700;
  border-radius:20px;padding:28px 22px;
  text-align:center;max-width:340px;width:100%;
  box-shadow:0 0 40px rgba(255,215,0,.2);
}
.result-box h2{font-size:1.5rem;color:#ffd700;margin-bottom:8px}
.result-box p{color:#a0c0e8;margin-bottom:10px;line-height:1.45;font-size:.95rem}
.result-box .amount{font-size:2rem;font-weight:900;color:#ffd700;margin:12px 0}
.result-box button{
  width:100%;padding:13px;border:none;border-radius:50px;
  background:linear-gradient(135deg,#ffd700,#e6b800);
  color:#1a1200;font-weight:900;font-size:.95rem;
  cursor:pointer;margin-top:8px;text-transform:uppercase;
}
.audience-bars{margin-top:10px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.85rem;color:#c0d8ff}
.bar-bg{flex:1;height:14px;background:#0a1528;border-radius:8px;overflow:hidden;border:1px solid #1a3060}
.bar-fill{height:100%;background:linear-gradient(90deg,#ffd700,#f5a623);border-radius:8px;transition:width .9s}
.phone-msg{
  background:rgba(0,20,50,.8);border:1px solid rgba(100,160,255,.3);
  border-radius:12px;padding:14px;margin-top:10px;
  font-size:.9rem;line-height:1.45;color:#c8dcff;
}
</style>
</head>
<body>
<div class="game-wrap">

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="walk-btn" onclick="walkAway()">
      <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
      <div>
        <div style="font-size:.65rem;opacity:.8">Walk</div>
        <div class="m-badge" id="walkAmount">₦0</div>
      </div>
    </button>

    <div class="q-circle-wrap">
      <div class="q-circle-ring"></div>
      <div class="q-circle" id="qCircle">1</div>
    </div>

    <div class="gems">
      <span>◆</span> <span id="subjectShort">ENG</span>
    </div>
  </div>

  <!-- PRIZE BANNER -->
  <div class="prize-banner">
    <div class="main-prize" id="prizeMain">₦1,000</div>
    <div class="sub-prize" id="prizeSub">Safe: ₦0</div>
  </div>

  <!-- QUESTION -->
  <div class="q-area">
    <div class="cat-icon" id="catIcon">📚</div>
    <div class="q-text" id="qText">Loading question...</div>
  </div>

  <!-- OPTIONS -->
  <div class="options" id="options"></div>

  <!-- LIFELINES -->
  <div class="lifelines">
    <button class="life-btn" id="life5050" onclick="use5050()">
      <span class="icon">½</span>50:50
    </button>
    <button class="life-btn" id="lifeAudience" onclick="useAudience()">
      <span class="icon">👥</span>
      <span class="badge">3</span>
    </button>
    <button class="life-btn" id="lifeSwitch" onclick="useSwitch()">
      <span class="icon">🔄</span>
    </button>
    <button class="life-btn" id="lifePhone" onclick="usePhone()">
      <span class="icon">👤</span>
      <span class="badge">5</span>
    </button>
  </div>

  <div class="bottom-banner">SHOW WHAT YOU KNOW!</div>
</div>

<!-- RESULT -->
<div class="overlay" id="resultOverlay">
  <div class="result-box">
    <h2 id="resultTitle">Congratulations!</h2>
    <p id="resultMsg"></p>
    <div class="amount" id="resultAmount">₦0</div>
    <button onclick="location.href='millionaire.html'">Play Again</button>
    <button onclick="location.href='index.html'" style="background:linear-gradient(135deg,#1a4a8a,#0d2a5a);color:#ffd700">Home</button>
  </div>
</div>

<!-- LIFELINE POPUP -->
<div class="overlay" id="lifeOverlay">
  <div class="result-box">
    <h2 id="lifeTitle">Lifeline</h2>
    <div id="lifeContent"></div>
    <button onclick="closeLife()">Continue</button>
  </div>
</div>

<audio id="sfx" preload="auto"></audio>

<script>
const LADDER = [1000,2000,3000,5000,10000,20000,30000,50000,75000,150000,250000,500000,750000,1000000,2000000];
const SAFE = [4,9];
let questions=[], qIndex=0, currentMoney=0, safeMoney=0;
let used5050=false, usedPhone=false, usedAudience=false, usedSwitch=false;
let answered=false, subject='';

const sfx=document.getElementById('sfx');
sfx.src='assets/millionaire-sounds.mp3';
function playSound(){try{sfx.currentTime=0;sfx.play().catch(()=>{})}catch(e){}}

async function init(){
  const p=new URLSearchParams(location.search);
  subject=p.get('subject')||localStorage.getItem('millionaireSubject')||'English Language';
  document.getElementById('subjectShort').textContent=subject.slice(0,3).toUpperCase();
  await loadQuestions();
  showQuestion();
}

async function loadQuestions(){
  const map={
    'English Language':'use_of_english.json',
    'Literature in English':'the_lekki_headmaster.json',
    'Mathematics':'mathematics.json','Biology':'biology.json',
    'Chemistry':'chemistry.json','Physics':'physics.json',
    'Economics':'economics.json','Government':'government.json',
    'Commerce':'commerce.json','Geography':'geography.json',
    'Christian Religious Studies':'crs.json','Islamic Religious Studies':'irs.json'
  };
  const file=map[subject]||(subject.toLowerCase().replace(/\s+/g,'_')+'.json');
  try{
    for(const path of ['./question_bank/'+file,'question_bank/'+file,'./'+file]){
      try{
        const r=await fetch(path);
        if(r.ok){
          const d=await r.json();
          const arr=Array.isArray(d)?d:(d.questions||[]);
          questions=shuffle(arr).slice(0,15);
          break;
        }
      }catch(e){}
    }
  }catch(e){}
  if(questions.length<15) questions=shuffle(FALLBACK).slice(0,15);
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}

function showQuestion(){
  answered=false;
  const q=questions[qIndex];
  if(!q){endGame(true);return}

  document.getElementById('qCircle').textContent=qIndex+1;
  document.getElementById('qText').textContent=q.question||q.text||'No question';
  document.getElementById('prizeMain').textContent='₦'+LADDER[qIndex].toLocaleString();
  document.getElementById('prizeSub').textContent='Safe: ₦'+safeMoney.toLocaleString();
  document.getElementById('walkAmount').textContent='₦'+currentMoney.toLocaleString();

  let opts=q.options||[];
  if(q.A||q.a) opts=[q.A||q.a,q.B||q.b,q.C||q.c,q.D||q.d];
  opts=opts.map(o=>String(o).replace(/^[A-Da-d][.)]\s*/,'').trim());
  while(opts.length<4) opts.push('—');

  const letters=['A','B','C','D'];
  const box=document.getElementById('options');
  box.innerHTML='';
  opts.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='opt';
    d.innerHTML=`<span class="letter">${letters[i]}:</span> ${t}`;
    d.onclick=()=>selectAnswer(i);
    box.appendChild(d);
  });
  playSound();
}

function getCorrectIndex(q){
  if(typeof q.answer==='number') return q.answer;
  const a=String(q.answer||q.correct||'A').trim().toUpperCase();
  if(a==='A'||a==='0')return 0; if(a==='B'||a==='1')return 1;
  if(a==='C'||a==='2')return 2; if(a==='D'||a==='3')return 3;
  return 0;
}

function selectAnswer(idx){
  if(answered)return; answered=true;
  const correct=getCorrectIndex(questions[qIndex]);
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.style.pointerEvents='none';
    if(i===correct) el.classList.add('correct');
    if(i===idx&&i!==correct) el.classList.add('wrong');
  });
  playSound();
  setTimeout(()=>{
    if(idx===correct){
      currentMoney=LADDER[qIndex];
      if(SAFE.includes(qIndex)) safeMoney=currentMoney;
      qIndex++;
      if(qIndex>=15) endGame(true);
      else showQuestion();
    } else endGame(false);
  },1500);
}

function use5050(){
  if(used5050||answered)return;
  used5050=true; document.getElementById('life5050').classList.add('used');
  playSound();
  const c=getCorrectIndex(questions[qIndex]);
  const w=[0,1,2,3].filter(i=>i!==c);
  shuffle(w).slice(0,2).forEach(i=>document.querySelectorAll('.opt')[i].classList.add('dim'));
}

function useAudience(){
  if(usedAudience||answered)return;
  usedAudience=true; document.getElementById('lifeAudience').classList.add('used');
  playSound();
  const c=getCorrectIndex(questions[qIndex]);
  let pcts=[0,0,0,0]; pcts[c]=40+Math.floor(Math.random()*35);
  let rem=100-pcts[c];
  [0,1,2,3].filter(i=>i!==c).forEach((i,idx)=>{
    if(idx===2) pcts[i]=rem; else{const v=Math.floor(Math.random()*(rem/2));pcts[i]=v;rem-=v;}
  });
  const L=['A','B','C','D'];
  let h='<div class="audience-bars">';
  L.forEach((l,i)=>h+=`<div class="bar-row"><span>\( {l}</span><div class="bar-bg"><div class="bar-fill" style="width: \){pcts[i]}%"></div></div><span>${pcts[i]}%</span></div>`);
  h+='</div>';
  document.getElementById('lifeTitle').textContent='Ask the Audience';
  document.getElementById('lifeContent').innerHTML=h;
  document.getElementById('lifeOverlay').classList.add('show');
}

function usePhone(){
  if(usedPhone||answered)return;
  usedPhone=true; document.getElementById('lifePhone').classList.add('used');
  playSound();
  const c=getCorrectIndex(questions[qIndex]);
  const L=['A','B','C','D'];
  const conf=60+Math.floor(Math.random()*35);
  document.getElementById('lifeTitle').textContent='Phone a Friend';
  document.getElementById('lifeContent').innerHTML=`<div class="phone-msg">"I'm \( {conf}% sure the answer is <strong style="color:#ffd700"> \){L[c]}</strong>. Go with that!"</div>`;
  document.getElementById('lifeOverlay').classList.add('show');
}

function useSwitch(){
  if(usedSwitch||answered)return;
  usedSwitch=true; document.getElementById('lifeSwitch').classList.add('used');
  playSound();
  // swap current question with a random unused one from remaining pool if possible
  if(qIndex<questions.length-1){
    const swap=qIndex+1+Math.floor(Math.random()*(questions.length-qIndex-1));
    [questions[qIndex],questions[swap]]=[questions[swap],questions[qIndex]];
  }
  showQuestion();
}

function closeLife(){document.getElementById('lifeOverlay').classList.remove('show')}

function walkAway(){
  if(!confirm('Walk away with ₦'+currentMoney.toLocaleString()+'?'))return;
  endGame(true,true);
}

function endGame(won,walked){
  playSound();
  const t=document.getElementById('resultTitle');
  const m=document.getElementById('resultMsg');
  const a=document.getElementById('resultAmount');
  if(walked){t.textContent='You Walked Away!';m.textContent='You leave with:';a.textContent='₦'+currentMoney.toLocaleString()}
  else if(won&&qIndex>=15){t.textContent='MILLIONAIRE!';m.textContent='All 15 correct!';a.textContent='₦'+LADDER[14].toLocaleString()}
  else{t.textContent='Wrong Answer!';m.textContent='You leave with the safe amount:';a.textContent='₦'+safeMoney.toLocaleString()}
  document.getElementById('resultOverlay').classList.add('show');
}

const FALLBACK=[
  {question:"What is the capital of Nigeria?",options:["A. Lagos","B. Abuja","C. Kano","D. Port Harcourt"],answer:"B"},
  {question:"Who wrote 'Things Fall Apart'?",options:["A. Wole Soyinka","B. Chinua Achebe","C. Chimamanda Adichie","D. Buchi Emecheta"],answer:"B"},
  {question:"What is 15 × 12?",options:["A. 150","B. 180","C. 170","D. 160"],answer:"B"},
  {question:"Which gas do plants absorb?",options:["A. Oxygen","B. Nitrogen","C. Carbon dioxide","D. Hydrogen"],answer:"C"},
  {question:"How many states are in Nigeria?",options:["A. 30","B. 36","C. 37","D. 42"],answer:"B"},
  {question:"What is the chemical symbol for gold?",options:["A. Go","B. Gd","C. Au","D. Ag"],answer:"C"},
  {question:"Who was the first President of Nigeria?",options:["A. Obafemi Awolowo","B. Nnamdi Azikiwe","C. Ahmadu Bello","D. Tafawa Balewa"],answer:"B"},
  {question:"What is the square root of 144?",options:["A. 11","B. 12","C. 13","D. 14"],answer:"B"},
  {question:"Which planet is known as the Red Planet?",options:["A. Venus","B. Mars","C. Jupiter","D. Saturn"],answer:"B"},
  {question:"In which year did Nigeria gain independence?",options:["A. 1957","B. 1960","C. 1963","D. 1966"],answer:"B"},
  {question:"What is the largest organ in the human body?",options:["A. Liver","B. Brain","C. Skin","D. Heart"],answer:"C"},
  {question:"Which is the longest river in Nigeria?",options:["A. Benue","B. Niger","C. Cross River","D. Kaduna"],answer:"B"},
  {question:"What does CPU stand for?",options:["A. Central Processing Unit","B. Computer Personal Unit","C. Central Program Utility","D. Control Processing Unit"],answer:"A"},
  {question:"Who painted the Mona Lisa?",options:["A. Michelangelo","B. Leonardo da Vinci","C. Raphael","D. Picasso"],answer:"B"},
  {question:"What is the currency of Japan?",options:["A. Yuan","B. Won","C. Yen","D. Ringgit"],answer:"C"},
  {question:"How many continents are there?",options:["A. 5","B. 6","C. 7","D. 8"],answer:"C"},
  {question:"What is H2O commonly known as?",options:["A. Salt","B. Water","C. Oxygen","D. Hydrogen"],answer:"B"},
  {question:"Which animal is known as the king of the jungle?",options:["A. Tiger","B. Elephant","C. Lion","D. Gorilla"],answer:"C"},
  {question:"What is the boiling point of water?",options:["A. 90°C","B. 100°C","C. 110°C","D. 120°C"],answer:"B"},
  {question:"Who discovered gravity?",options:["A. Einstein","B. Newton","C. Galileo","D. Tesla"],answer:"B"}
];

init();
</script>
</body>
</html>

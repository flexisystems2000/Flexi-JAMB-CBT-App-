<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Who Wants to be a Millionaire – Flexi</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#0a1a4a 0%,#0d2b6b 40%,#1a0a4a 100%);
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(80,140,255,.2) 0%,transparent 55%),
    radial-gradient(circle at 15% 90%,rgba(100,60,200,.12) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(40,100,220,.1) 0%,transparent 40%);
  pointer-events:none;
  z-index:0;
}

.game-wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:10px 12px 16px;
}

/* TOP BAR */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.walk-btn{
  background:linear-gradient(180deg,#1a4a8a,#0d2a5a);
  border:2px solid #3a7adf;
  border-radius:12px;
  padding:6px 10px 6px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#fff;
  font-size:.7rem;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

.walk-btn svg{
  width:22px;
  height:22px;
  fill:#fff;
}

.walk-btn .m-badge{
  background:#ffd700;
  color:#1a1a00;
  font-size:.65rem;
  font-weight:900;
  padding:2px 6px;
  border-radius:8px;
}

/* TIMER */
.q-circle-wrap{
  position:relative;
  width:72px;
  height:72px;
}

.q-circle{
  width:72px;
  height:72px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#1a3a7a,#0a1540);
  box-shadow:
    0 0 0 3px #ffd700,
    0 0 20px rgba(255,215,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.6rem;
  font-weight:900;
  color:#fff;
  position:relative;
  z-index:2;
  transition:.25s ease;
}

.q-circle.warning{
  color:#ff9800;
  box-shadow:
    0 0 0 3px #ff9800,
    0 0 25px rgba(255,152,0,.55);
}

.q-circle.danger{
  color:#ff3333;
  box-shadow:
    0 0 0 3px #ff3333,
    0 0 30px rgba(255,50,50,.7);
  animation:timerPulse .6s infinite alternate;
}

@keyframes timerPulse{
  from{transform:scale(1);}
  to{transform:scale(1.06);}
}

.q-circle-ring{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px dashed rgba(255,215,0,.5);
  animation:spin 12s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* LANGUAGE SELECTOR */
.language-wrap{
  display:flex;
  align-items:center;
  gap:4px;
  background:rgba(0,30,80,.6);
  border:1px solid rgba(100,160,255,.35);
  border-radius:20px;
  padding:4px 7px 4px 9px;
}

.language-icon{
  font-size:.85rem;
}

.language-select{
  border:none;
  outline:none;
  background:transparent;
  color:#7ec8ff;
  font-size:.75rem;
  font-weight:800;
  cursor:pointer;
  max-width:58px;
}

.language-select option{
  background:#0d1b4c;
  color:#fff;
}

/* PRIZE BANNER */
.prize-banner{
  background:linear-gradient(90deg,#e6b800,#ffd700,#f5c400);
  border-radius:8px;
  padding:10px 16px;
  text-align:center;
  margin:10px 0 14px;
  box-shadow:0 4px 15px rgba(255,200,0,.35);
  clip-path:polygon(
    4% 0%,
    96% 0%,
    100% 50%,
    96% 100%,
    4% 100%,
    0% 50%
  );
}

.prize-banner .main-prize{
  font-size:1.5rem;
  font-weight:900;
  color:#1a1200;
}

.prize-banner .sub-prize{
  font-size:.75rem;
  font-weight:700;
  color:#5a4500;
}

/* QUESTION */
.q-area{
  background:linear-gradient(
    180deg,
    rgba(10,30,80,.85),
    rgba(8,20,55,.9)
  );
  border:1px solid rgba(80,140,255,.3);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.cat-icon{
  width:42px;
  height:42px;
  flex-shrink:0;
  background:linear-gradient(135deg,#2e7d32,#1b5e20);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.3rem;
  border:2px solid #66bb6a;
}

.q-text{
  font-size:1rem;
  font-weight:600;
  line-height:1.45;
  color:#e8f0ff;
  flex:1;
}

/* OPTIONS */
.options{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:16px;
}

.opt{
  display:flex;
  align-items:center;
  background:linear-gradient(180deg,#0d2a5c,#0a1e48);
  border:2px solid #2a5a9e;
  border-radius:50px;
  padding:13px 16px 13px 14px;
  cursor:pointer;
  transition:.15s;
  font-size:.95rem;
  font-weight:600;
  color:#d8e8ff;
  clip-path:polygon(
    3% 0%,
    97% 0%,
    100% 50%,
    97% 100%,
    3% 100%,
    0% 50%
  );
}

.opt:active{
  transform:scale(.98);
}

.opt .letter{
  color:#ff9800;
  font-weight:900;
  margin-right:8px;
  font-size:1rem;
  min-width:22px;
}

.opt.correct{
  background:linear-gradient(180deg,#1b5e20,#0d3b12);
  border-color:#4caf50;
  box-shadow:0 0 18px rgba(76,175,80,.4);
}

.opt.wrong{
  background:linear-gradient(180deg,#b71c1c,#7f0000);
  border-color:#ef5350;
  box-shadow:0 0 18px rgba(239,83,80,.35);
}

.opt.dim{
  opacity:.3;
  pointer-events:none;
}

/* LIFELINES */
.lifelines{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.life-btn{
  width:66px;
  height:66px;
  border-radius:50%;
  border:3px solid #3a7adf;
  background:radial-gradient(
    circle at 35% 30%,
    #1a4a9a,
    #0a2048
  );
  color:#fff;
  font-size:.55rem;
  font-weight:800;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:.15s;
  box-shadow:0 0 12px rgba(50,120,220,.3);
  gap:2px;
}

.life-btn:active{
  transform:scale(.92);
}

.life-btn .icon{
  font-size:1.2rem;
  line-height:1;
}

.life-btn .life-label{
  font-size:.52rem;
  letter-spacing:.2px;
}

.life-btn .badge{
  position:absolute;
  top:-4px;
  right:-4px;
  background:#ff5722;
  color:#fff;
  font-size:.65rem;
  font-weight:900;
  width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #0a1a4a;
}

.life-btn.used{
  opacity:.3;
  pointer-events:none;
  filter:grayscale(1);
  border-color:#555;
  box-shadow:none;
}

/* BOTTOM */
.bottom-banner{
  margin-top:auto;
  text-align:center;
  padding:10px 0 4px;
  font-size:1.35rem;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(
    90deg,
    #ff9800,
    #ffd700,
    #ff9800
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-transform:uppercase;
}

/* OVERLAYS */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,8,30,.94);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
  backdrop-filter:blur(8px);
}

.overlay.show{
  display:flex;
}

.result-box{
  background:linear-gradient(180deg,#0d1b4c,#060d24);
  border:2px solid #ffd700;
  border-radius:20px;
  padding:28px 22px;
  text-align:center;
  max-width:340px;
  width:100%;
  box-shadow:0 0 40px rgba(255,215,0,.2);
}

.result-box h2{
  font-size:1.5rem;
  color:#ffd700;
  margin-bottom:8px;
}

.result-box p{
  color:#a0c0e8;
  margin-bottom:10px;
  line-height:1.45;
  font-size:.95rem;
}

.result-box .amount{
  font-size:2rem;
  font-weight:900;
  color:#ffd700;
  margin:12px 0;
}

.result-box button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#ffd700,#e6b800);
  color:#1a1200;
  font-weight:900;
  font-size:.95rem;
  cursor:pointer;
  margin-top:8px;
  text-transform:uppercase;
}

.audience-bars{
  margin-top:10px;
}

.bar-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  font-size:.85rem;
  color:#c0d8ff;
}

.bar-bg{
  flex:1;
  height:14px;
  background:#0a1528;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #1a3060;
}

.bar-fill{
  height:100%;
  background:linear-gradient(90deg,#ffd700,#f5a623);
  border-radius:8px;
  transition:width .9s;
}

.phone-msg{
  background:rgba(0,20,50,.8);
  border:1px solid rgba(100,160,255,.3);
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  font-size:.9rem;
  line-height:1.45;
  color:#c8dcff;
}

.timeout-icon{
  font-size:3rem;
  margin-bottom:8px;
}

@media(max-width:360px){

  .lifelines{
    gap:6px;
  }

  .life-btn{
    width:60px;
    height:60px;
  }

  .q-circle-wrap,
  .q-circle{
    width:66px;
    height:66px;
  }

}
</style>
</head>

<body>

<div class="game-wrap">

  <!-- TOP BAR -->
  <div class="top-bar">

    <button class="walk-btn" onclick="walkAway()">

      <svg viewBox="0 0 24 24">
        <path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/>
      </svg>

      <div>

        <div
          style="font-size:.65rem;opacity:.8"

          Walk
        </div>

        <div
          class="m-badge"

        >
          ₦0
        </div>

      </div>

    <!-- TIMER -->
    <div class="q-circle-wrap">

      <div class="q-circle-ring"></div>

      <div
        class="q-circle"

      >
        30
      </div>

    </div>


    <!-- LANGUAGE SELECTOR -->
    <div class="language-wrap">

      <select
        id="languageSelect"

      >

    </div>

    <div
      class="sub-prize"
      id="prizeSub"

      Safe: ₦0
    </div>

  </div>


  <!-- QUESTION -->
  <div class="q-area">

    <div
      class="cat-icon"
      id="catIcon"
    >
      📚
    </div>

    <div
      class="q-text"
      id="qText"

  <!-- OPTIONS -->

  <!-- LIFELINES -->
  <div class="lifelines">

    <button

  <div class="bottom-banner">

</div>


<!-- RESULT OVERLAY -->
<div
  class="overlay"
  id="resultOverlay"
>

  <div class="result-box">

    <h2 id="resultTitle">
      Congratulations!
    </h2>

    <p id="resultMsg"></p>

    <div
      class="amount"
      id="resultAmount"
    >
      ₦0
    </div>


    <button
      onclick="stopSound(); location.href='millionaire.html'"
    >
      Play Again
    </button>


    <button
      onclick="stopSound(); location.href='index.html'"
      style="background:linear-gradient(135deg,#1a4a8a,#0d2a5a);color:#ffd700"
    >
      Home
    </button>

  </div>

</div>


<!-- LIFELINE OVERLAY -->
<div
  class="overlay"
  id="lifeOverlay"
>

  <div class="result-box">

    <h2 id="lifeTitle">
      Lifeline
    </h2>

    <div id="lifeContent"></div>

    <button onclick="closeLife()">
      CONTINUE
    </button>

  </div>

</div>


<!-- TIMEOUT OVERLAY -->
<div
  class="overlay"
  id="timeoutOverlay"
>

  <div class="result-box">

    <div class="timeout-icon">
      ⏰
    </div>

    <h2>
      Time's Up!
    </h2>

    <p>
      Your 30-second time limit has expired.
    </p>

    <button onclick="closeTimeoutAndEnd()">
      CONTINUE
    </button>

  </div>

</div>


<!-- AUDIO -->
<audio
  id="sfx"
  preload="auto"
></audio>


<script>

/* =========================================================
   GAME CONFIGURATION
========================================================= */

const LADDER = [

  1000,
  2000,
  3000,
  5000,
  10000,
  20000,
  30000,
  50000,
  75000,
  150000,
  250000,
  500000,
  750000,
  1000000,
  2000000

];


/*
 * Safe milestones:
 *
 * Question 5  = ₦10,000
 * Question 10 = ₦150,000
 */
const SAFE = [4,9];


/*
 * 30 seconds per question.
 */
const QUESTION_TIME = 30;


/* =========================================================
   GAME STATE
========================================================= */

let questions = [];

let qIndex = 0;

let currentMoney = 0;

let safeMoney = 0;

let answered = false;

let subject = '';

let timerInterval = null;

let timeLeft = QUESTION_TIME;

let timerPaused = false;

let timeOutPending = false;


/*
 * Each lifeline starts with 3 uses.
 */
let lifelines = {

  fifty:3,

  audience:3,

  switch:3,

  phone:3

};


/* =========================================================
   AUDIO
========================================================= */

const sfx =
  document.getElementById('sfx');


sfx.src =
  'assets/millionaire-sounds.mp3';

sfx.loop = true;

sfx.volume = 0.6;


/*
 * Remembers whether music was playing
 * before the player left the app.
 */
let musicWasPlaying = false;


/*
 * Start music.
 */
function startMusic(){

  try{

    sfx.play()
      .then(function(){

        musicWasPlaying = true;

      })
      .catch(function(){});

  }catch(e){}

}


/*
 * Stop music completely.
 */
function stopSound(){

  try{

    sfx.pause();

    sfx.currentTime = 0;

    musicWasPlaying = false;

  }catch(e){}

}


/*
 * IMPORTANT:
 *
 * When the player switches to another app,
 * locks the phone, changes browser tab, etc.,
 * the music pauses.
 *
 * When the player returns,
 * the music resumes.
 */
document.addEventListener(
  'visibilitychange',
  function(){

    if(document.hidden){

      /*
       * Remember that music was playing.
       */
      if(!sfx.paused){

        musicWasPlaying = true;

        sfx.pause();

      }


      /*
       * Also pause the question timer.
       */
      if(
        timerInterval &&
        !answered &&
        !timeOutPending
      ){

        timerPaused = true;

      }

    }else{

      /*
       * Resume music only if it was playing
       * before the player left.
       */
      if(
        musicWasPlaying &&
        !answered &&
        !timeOutPending
      ){

        sfx.play()
          .catch(function(){});

      }


      /*
       * Resume timer from the exact
       * remaining second.
       */
      if(
        !answered &&
        !timeOutPending
      ){

        timerPaused = false;

      }

    }

  }
);


/*
 * Additional mobile browser protection.
 */
window.addEventListener(
  'pagehide',
  function(){

    if(!sfx.paused){

      musicWasPlaying = true;

      sfx.pause();

    }


    if(
      !answered &&
      !timeOutPending
    ){

      timerPaused = true;

    }

  }
);


/*
 * pageshow is used by some mobile browsers
 * when returning to a page.
 */
window.addEventListener(
  'pageshow',
  function(){

    if(
      musicWasPlaying &&
      !answered &&
      !timeOutPending &&
      !document.hidden
    ){

      sfx.play()
        .catch(function(){});

    }


    if(
      !answered &&
      !timeOutPending &&
      !document.hidden
    ){

      timerPaused = false;

    }

  }
);


/* =========================================================
   TIMER
========================================================= */

function clearTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

}


function updateTimerDisplay(){

  const circle =
    document.getElementById(
      'qCircle'
    );


  circle.textContent =
    timeLeft;


  circle.classList.remove(
    'warning',
    'danger'
  );


  if(
    timeLeft <= 10 &&
    timeLeft > 5
  ){

    circle.classList.add(
      'warning'
    );

  }


  if(timeLeft <= 5){

    circle.classList.add(
      'danger'
    );

  }

}


function startTimer(){

  clearTimer();


  timeLeft =
    QUESTION_TIME;


  timerPaused =
    document.hidden;


  updateTimerDisplay();


  timerInterval =
    setInterval(
      function(){

        /*
         * Do absolutely nothing while:
         *
         * - app is in background
         * - lifeline popup is open
         * - answer has already been selected
         */
        if(
          document.hidden ||
          timerPaused ||
          answered
        ){

          return;

        }


        timeLeft--;


        updateTimerDisplay();


        if(timeLeft <= 0){

          clearTimer();

          handleTimeUp();

        }

      },
      1000
    );

}


function pauseTimer(){

  timerPaused = true;

}


function resumeTimer(){

  if(
    !answered &&
    !timeOutPending &&
    !document.hidden
  ){

    timerPaused = false;

  }

}


function handleTimeUp(){

  if(
    answered ||
    timeOutPending
  ){

    return;

  }


  answered = true;

  timeOutPending = true;


  clearTimer();


  document
    .querySelectorAll('.opt')
    .forEach(
      function(el){

        el.style.pointerEvents =
          'none';

      }
    );


  document
    .getElementById(
      'timeoutOverlay'
    )
    .classList.add('show');

}


function closeTimeoutAndEnd(){

  document
    .getElementById(
      'timeoutOverlay'
    )
    .classList.remove('show');


  timeOutPending = false;


  endGame(false);

}


/* =========================================================
   INITIALIZE GAME
========================================================= */

async function init(){

  const p =
    new URLSearchParams(
      location.search
    );


  subject =
    p.get('subject') ||
    localStorage.getItem(
      'millionaireSubject'
    ) ||
    'English Language';


  document.title =
    'Who Wants to be a Millionaire – ' +
    subject;


  await loadQuestions();


  updateLifelineBadges();


  showQuestion();


  /*
   * Music may be blocked by browser
   * until first user interaction.
   */
  startMusic();

}


/* =========================================================
   QUESTION LOADING
========================================================= */

async function loadQuestions(){

  const map = {

    'English Language':
      'use_of_english.json',

    'Literature in English':
      'the_lekki_headmaster.json',

    'Mathematics':
      'mathematics.json',

    'Biology':
      'biology.json',

    'Chemistry':
      'chemistry.json',

    'Physics':
      'physics.json',

    'Economics':
      'economics.json',

    'Government':
      'government.json',

    'Commerce':
      'commerce.json',

    'Geography':
      'geography.json',

    'Christian Religious Studies':
      'crs.json',

    'Islamic Religious Studies':
      'irs.json'

  };


  const file =
    map[subject] ||
    (
      subject
        .toLowerCase()
        .replace(/\s+/g,'_') +
      '.json'
    );


  try{

    for(
      const path of [

        './question_bank/' +
        file,

        'question_bank/' +
        file,

        './' +
        file

      ]
    ){

      try{

        const r =
          await fetch(path);


        if(r.ok){

          const d =
            await r.json();


          const arr =
            Array.isArray(d)
              ? d
              : (
                  d.questions ||
                  []
                );


          questions =
            shuffle(arr)
              .slice(0,15);


          if(
            questions.length >= 15
          ){

            break;

          }

        }

      }catch(e){}

    }

  }catch(e){}


  /*
   * Fallback if the question bank
   * cannot be loaded.
   */
  if(
    questions.length < 15
  ){

    questions =
      shuffle(FALLBACK)
        .slice(0,15);

  }

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(a){

  const b =
    [...a];


  for(
    let i = b.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      b[i],
      b[j]
    ] =
    [
      b[j],
      b[i]
    ];

  }


  return b;

}

/* =========================================================

========================================================= */

function showQuestion(){

  answered = false;

  timeOutPending = false;


  const q =
    questions[qIndex];


  if(!q){

    endGame(true);

    return;

  }


  /*
   * The big circle is the timer.
   */
  document
    .getElementById(
      'qCircle'
    )
    .textContent =
      QUESTION_TIME;


  document
    .getElementById(
      'qText'
    )
    .textContent =
      q.question ||
      q.text ||
      'No question';


  document
    .getElementById(
      'prizeMain'
    )
    .textContent =
      '₦' +
      LADDER[qIndex]
        .toLocaleString();


  document
    .getElementById(
      'prizeSub'
    )
    .textContent =
      'Safe: ₦' +
      safeMoney
        .toLocaleString();


  document
    .getElementById(
      'walkAmount'
    )
    .textContent =
      '₦' +
      currentMoney
        .toLocaleString();


  let opts =
    q.options ||
    [];


  if(q.A || q.a){

    opts = [

      q.A || q.a,

      q.B || q.b,

      q.C || q.c,

      q.D || q.d

    ];

  }


  opts =
    opts.map(
      function(o){

        return String(o)
          .replace(
            /^[A-Da-d][.)]\s*/,
            ''
          )
          .trim();

      }
    );


  while(
    opts.length < 4
  ){

    opts.push('—');

  }


  const letters = [
    'A',
    'B',
    'C',
    'D'
  ];


  const box =
    document.getElementById(
      'options'
    );


  box.innerHTML = '';


  opts.forEach(
    function(t,i){

      const d =
        document.createElement(
          'div'
        );


      d.className =
        'opt';


      d.innerHTML =
        '<span class="letter">' +
        letters[i] +
        ':</span> ' +
        t;


      d.onclick =
        function(){

          selectAnswer(i);

        };


      box.appendChild(d);

    }
  );


  updateSafeAmount();

  updateLifelineButtons();

  startTimer();

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function getCorrectIndex(q){

  if(
    typeof q.answer ===
    'number'
  ){

    return q.answer;

  }


  const a =
    String(
      q.answer ||
      q.correct ||
      'A'
    )
    .trim()
    .toUpperCase();


  if(
    a === 'A' ||
    a === '0'
  ){

    return 0;

  }


  if(
    a === 'B' ||
    a === '1'
  ){

    return 1;

  }


  if(
    a === 'C' ||
    a === '2'
  ){

    return 2;

  }


  if(
    a === 'D' ||
    a === '3'
  ){

    return 3;

  }


  return 0;

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(idx){

  if(answered){

    return;

  }


  answered = true;


  clearTimer();


  const correct =
    getCorrectIndex(
      questions[qIndex]
    );


  document
    .querySelectorAll('.opt')
    .forEach(
      function(el,i){

        el.style.pointerEvents =
          'none';


        if(i === correct){

          el.classList.add(
            'correct'
          );

        }


        if(
          i === idx &&
          i !== correct
        ){

          el.classList.add(
            'wrong'
          );

        }

      }
    );


  setTimeout(
    function(){

      if(
        idx === correct
      ){

        currentMoney =
          LADDER[qIndex];


        /*
         * Update safe money when
         * the safe milestone is reached.
         */
        if(
          SAFE.includes(qIndex)
        ){

          safeMoney =
            currentMoney;

        }


        qIndex++;


        if(
          qIndex >= 15
        ){

          endGame(true);

        }else{

          showQuestion();

        }

      }else{

        endGame(false);

      }

    },
    1500
  );

}

/* =========================================================
   50:50
========================================================= */

function use5050(){

  if(
    lifelines.fifty <= 0 ||
    answered
  ){

    return;

  }


  lifelines.fifty--;


  updateLifelineButtons();


  const c =
    getCorrectIndex(
      questions[qIndex]
    );


  const wrongs =
    [0,1,2,3].filter(
      function(i){

        return i !== c;

      }
    );


  shuffle(wrongs)
    .slice(0,2)
    .forEach(
      function(i){

        const option =
          document
            .querySelectorAll(
              '.opt'
            )[i];


        if(option){

          option.classList.add(
            'dim'
          );

        }

      }
    );

}


/* =========================================================
   AUDIENCE
========================================================= */

function useAudience(){

  if(
    lifelines.audience <= 0 ||
    answered
  ){

    return;

  }


  lifelines.audience--;


  updateLifelineButtons();


  pauseTimer();


  const c =
    getCorrectIndex(
      questions[qIndex]
    );


  let pcts =
    [0,0,0,0];


  pcts[c] =
    40 +
    Math.floor(
      Math.random() * 35
    );


  let rem =
    100 - pcts[c];


  [0,1,2,3]
    .filter(
      function(i){

        return i !== c;

      }
    )
    .forEach(
      function(i,idx){

        if(idx === 2){

          pcts[i] =
            rem;

        }else{

          const v =
            Math.floor(
              Math.random() *
              (rem / 2)
            );


          pcts[i] =
            v;


          rem -= v;

        }

      }
    );


  const letters = [
    'A',
    'B',
    'C',
    'D'
  ];


  let h =
    '<div class="audience-bars">';


  letters.forEach(
    function(l,i){

      h +=

        '<div class="bar-row">' +

          '<span>' +
            l +
          '</span>' +

          '<div class="bar-bg">' +

            '<div class="bar-fill" style="width:' +
              pcts[i] +
            '%"></div>' +

          '</div>' +

          '<span>' +
            pcts[i] +
            '%' +
          '</span>' +

        '</div>';

    }
  );


  h +=
    '</div>';


  document
    .getElementById(
      'lifeTitle'
    )
    .textContent =
      'Ask the Audience';


  document
    .getElementById(
      'lifeContent'
    )
    .innerHTML =
      h;


  document
    .getElementById(
      'lifeOverlay'
    )
    .classList.add(
      'show'
    );

}

/* =========================================================
   SWITCH QUESTION
========================================================= */

function useSwitch(){

  if(
    lifelines.switch <= 0 ||
    answered
  ){

    return;

  }


  lifelines.switch--;


  updateLifelineButtons();


  if(
    qIndex <
    questions.length - 1
  ){

    const swap =
      qIndex +
      1 +
      Math.floor(
        Math.random() *
        (
          questions.length -
          qIndex -
          1
        )
      );


    const tmp =
      questions[qIndex];


    questions[qIndex] =
      questions[swap];


    questions[swap] =
      tmp;

  }


  showQuestion();

}


/* =========================================================
   CLOSE LIFELINE
========================================================= */

function closeLife(){

  document
    .getElementById(
      'lifeOverlay'
    )
    .classList.remove(
      'show'
    );


  /*
   * Resume the timer exactly where
   * it stopped.
   */
  resumeTimer();

}

  if(
    !confirm(
      'Walk away with ₦' +
      currentMoney.toLocaleString() +

  clearTimer();


  endGame(

  );

}


/* =========================================================
   END GAME
========================================================= */

function endGame(
  won,
  walked
){

  clearTimer();


  stopSound();


  const t =
    document.getElementById(
      'resultTitle'
    );


  const m =
    document.getElementById(
      'resultMsg'
    );


  const a =
    document.getElementById(
      'resultAmount'
    );


  if(walked){

    t.textContent =
      'You Walked Away!';


    m.textContent =
      'You leave with:';


    a.textContent =
      '₦' +
      currentMoney.toLocaleString();

  }

  else if(
    won &&
    qIndex >= 15
  ){

    t.textContent =
      'MILLIONAIRE!';


    m.textContent =
      'All 15 correct!';


    a.textContent =
      '₦' +
      LADDER[14].toLocaleString();

  }

  else{

    t.textContent =
      'Wrong Answer!';


    m.textContent =
      'You leave with the safe amount:';


    a.textContent =
      '₦' +
      safeMoney.toLocaleString();

  }


  document
    .getElementById(
      'resultOverlay'
    )
    .classList.add(
      'show'
    );

}
